<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ted</title>
<style>
:root{
  --bg:#151717; --side:#1a1d1d; --panel:#212525; --panel2:#293030;
  --line:#2e3434; --text:#e9edec; --dim:#939b99;
  --accent:#16DEDE;            /* teal — Charlie's pick */
  --accent-soft:rgba(22,222,222,.13);
  --ok:#5fc492; --warn:#dcab50; --down:#d95850;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
/* NOTE: no user-select:none anywhere near body — WebKit won't let children
   re-enable selection under a none ancestor, which silently killed copying. */
body{background:var(--bg);color:var(--text);overflow:hidden;
  font:14px/1.55 -apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;
  display:flex}
button,#side,#top,#sidefoot{-webkit-user-select:none;user-select:none}

/* ── sidebar ─────────────────────────────────────────────── */
#side{width:250px;flex:none;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;transition:width .25s ease,border .25s;overflow:hidden}
#side.collapsed{width:0;border-right:none}
#side>*{min-width:230px}

/* right panel — apps Ted has used this session */
#apps{width:0;flex:none;background:var(--side);border-left:none;overflow:hidden;
  transition:width .25s ease;display:flex;flex-direction:column}
#apps.open{width:200px;border-left:1px solid var(--line)}
#apps>*{min-width:180px}
#apps h3{padding:16px 16px 8px;font-size:10px;letter-spacing:.25em;color:var(--dim)}
#apps-list{padding:0 10px 10px;overflow-y:auto;flex:1}
#apps-list::-webkit-scrollbar{width:4px}
#apps-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.appitem{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
  font-size:12.5px;margin-bottom:2px;background:var(--panel)}
.appitem .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.appitem.used .dot{background:var(--accent)}
.appitem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appitem .tag{font-size:9.5px;color:var(--accent);letter-spacing:.06em;flex:none}
.appitem .x{margin-left:auto;cursor:pointer;color:var(--dim);flex:none;
  padding:0 3px;border-radius:4px;font-size:13px}
.appitem .x:hover{color:var(--down)}
#apps-empty{padding:8px 16px;color:var(--dim);font-size:12px;line-height:1.6}
#side .brand{padding:18px 16px 10px;display:flex;align-items:baseline;gap:8px}
#side .brand .t{font-size:15px;font-weight:650;letter-spacing:.18em}
#side .brand .v{font-size:10px;color:var(--dim)}
#newchat{margin:6px 12px 10px;padding:9px 12px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;
  font-size:13px;text-align:left;transition:all .2s}
#newchat:hover{border-color:var(--accent);color:var(--accent)}
#chats{flex:1;overflow-y:auto;padding:0 8px 8px}
#chats::-webkit-scrollbar{width:4px}
#chats::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.chatitem{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;
  border-left:2px solid transparent}
.chatitem:hover{background:var(--panel)}
.chatitem.active{background:var(--panel);border-left-color:var(--accent)}
.chatitem .ct{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatitem .cm{font-size:11px;color:var(--dim);margin-top:1px}
#sidefoot{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
#sidefoot .row{display:flex;align-items:center;gap:10px;margin-top:6px}
#membtn{cursor:pointer;padding:6px 0;color:var(--dim);transition:color .2s}
#membtn:hover{color:var(--text)}
.hd{display:flex;align-items:center;gap:4px;font-size:10px;letter-spacing:.08em}
.hd i{width:6px;height:6px;border-radius:50%;background:var(--dim);display:inline-block}
.hd i.on{background:var(--ok)}
.hd i.off{background:var(--down)}

/* ── main column ─────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{padding:10px 16px;border-bottom:1px solid var(--line);position:relative;
  display:flex;align-items:center;gap:10px;min-height:58px}
#chat-title{display:none}
.hbtn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;
  padding:5px 8px;flex:none;border-radius:7px;transition:color .2s}
.hbtn:hover{color:var(--text)}
.hbtn.noted{color:var(--accent)}
#status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);
  flex:none;opacity:0;transition:opacity .25s}
#status.active{opacity:1}
#status i{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:background .3s}
#status.listening i{background:var(--ok)}
#status.thinking i{background:var(--warn)}
#status.speaking i{background:var(--accent)}

/* now playing — top left, out of the chat's way */
#np-slot{font-size:11.5px;color:var(--dim);display:none;align-items:center;gap:5px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:3px 11px;
  max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np-slot.show{display:flex}

/* clock — dead centre: time on top, date+weather under it */
#clock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;line-height:1.35}
#clock.hidden{display:none}
#clk-time{font:600 16px ui-monospace,Menlo,monospace;letter-spacing:.05em}
#clk-sub{font-size:11px;color:var(--dim)}
#clk-sub .wx{color:var(--accent)}
#topright{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
#chips{display:flex;gap:8px;padding:0 22px;flex-wrap:wrap}
.chip{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:3px 12px;font-size:11.5px;color:var(--dim);display:flex;gap:6px;align-items:center}
.chip.alarm{border-color:var(--accent);color:var(--accent)}
.chip .x{cursor:pointer}

/* messages */
#scroll{flex:1;overflow-y:auto;-webkit-user-select:text;user-select:text}
#scroll::-webkit-scrollbar{width:6px}
#scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
#msgs{max-width:740px;margin:0 auto;padding:26px 24px 30px}
.m{margin:16px 0;line-height:1.6;position:relative}
/* belt-and-braces selection: some pywebview/WebKit builds ignore text_select */
#msgs,.m,.m .b,.m .b *{-webkit-user-select:text!important;user-select:text!important;
  cursor:auto;-webkit-touch-callout:default}
/* right-click copy menu (WKWebView's native menu has no Copy item) */
#ctxmenu{position:fixed;z-index:60;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:4px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#ctxmenu.open{display:block}
#ctxmenu button{display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--text);font:inherit;font-size:13px;padding:6px 16px;border-radius:5px;cursor:pointer}
#ctxmenu button:hover{background:var(--accent);color:#0c2b2b}
.m.user{display:flex;justify-content:flex-end}
.m.user .b{background:var(--panel2);padding:9px 15px;border-radius:16px 16px 4px 16px;
  max-width:82%;white-space:pre-wrap}
.m.ted .b{white-space:pre-wrap;color:#d8d5d1}
.m.ted .b code{background:var(--panel);border-radius:4px;padding:1px 5px;
  font:12.5px ui-monospace,Menlo,monospace}
.m.ted .b b{color:var(--text)}

/* fenced code blocks — editor-style box with copy button */
.codebox{background:#1a1a1a;border:1px solid var(--line);border-radius:10px;
  margin:10px 0;overflow:hidden}
.codebox .chead{display:flex;justify-content:space-between;align-items:center;
  padding:6px 12px;background:#202020;border-bottom:1px solid var(--line);
  font-size:11px;color:var(--dim)}
.codebox .copy{cursor:pointer;background:none;border:none;color:var(--dim);
  font:inherit;padding:2px 6px;border-radius:5px;transition:color .2s}
.codebox .copy:hover{color:var(--text)}
.codebox .copy.done{color:var(--ok)}
.codebox pre{margin:0;padding:12px 14px;overflow-x:auto;white-space:pre;
  font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#d8d5d1}
.codebox pre::-webkit-scrollbar{height:5px}
.codebox pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.tok-kw{color:#c586b6}   /* keywords   — soft magenta */
.tok-st{color:#a8bf8f}   /* strings    — sage green   */
.tok-cm{color:#6f6d6a;font-style:italic}  /* comments */
.tok-nm{color:#c9a35c}   /* numbers    — amber        */
.tok-fn{color:#8fb4c9}   /* calls/defs — steel blue   */
#empty{color:var(--dim);text-align:center;margin-top:16vh;line-height:2}
#empty .big{font-size:19px;color:var(--text)}

/* input */
#inwrap{flex:none;padding:10px 24px 18px}
#heard{max-width:740px;margin:0 auto 6px;font-size:12px;color:var(--dim);
  min-height:16px;padding:0 4px;opacity:0;transition:opacity .25s}
#heard.show{opacity:1}
#bar{max-width:740px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
  background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 10px}
#bar:focus-within{border-color:#3a3a3a}
#input{flex:1;background:transparent;border:none;outline:none;color:var(--text);
  font:inherit;padding:6px 8px;resize:none;max-height:150px;
  -webkit-user-select:text;user-select:text}
#input::placeholder{color:var(--dim)}
.ibtn{width:36px;height:36px;flex:none;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:transparent;color:var(--dim);transition:all .2s}
.ibtn:hover{color:var(--text)}
#send{background:var(--accent);color:#0c2b2b}
#send:disabled{background:var(--panel2);color:var(--dim);cursor:default}
#mic{border:1px solid var(--line);color:var(--dim)}
#mic:hover{border-color:var(--accent);color:var(--accent)}
#mic.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);
  animation:micpulse 1.8s ease-in-out infinite}
#mic svg{width:17px;height:17px}
@keyframes micpulse{
  0%,100%{box-shadow:0 0 0 0 rgba(22,222,222,.35)}
  50%{box-shadow:0 0 0 7px rgba(22,222,222,0)}
}

/* toast */
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--panel);border:1px solid var(--warn);color:var(--text);border-radius:10px;
  padding:9px 16px;font-size:12.5px;opacity:0;pointer-events:none;transition:all .3s;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%)}

/* reminders dropdown */
#rempanel{position:fixed;top:60px;right:20px;z-index:25;background:var(--side);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:280px;display:none}
#rempanel.open{display:block}
#rempanel h3{font-size:10px;letter-spacing:.25em;color:var(--dim);margin-bottom:8px}
#rempanel .x{float:right;cursor:pointer}
#remlist div{font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
#remlist div:last-child{border:none}

/* memory overlay */
#mempanel{position:fixed;inset:0;z-index:40;background:#0f1115;display:none;flex-direction:column}
#mempanel.open{display:flex}
#mempanel header{padding:12px 18px;font-size:10px;letter-spacing:.3em;color:var(--dim);
  display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
#mempanel header .x{cursor:pointer;font-size:15px;color:var(--text);letter-spacing:0}
#memframe{flex:1;border:none;width:100%;background:#0f1115}
</style>
</head>
<body>

<div id="side">
  <div class="brand"><span class="t">TED</span><span class="v" id="hdr-v">v4</span></div>
  <button id="newchat">+ New chat</button>
  <div id="chats"></div>
  <div id="sidefoot">
    <div id="membtn" title="Ted's memory">&#9783; Memory</div>
  </div>
</div>

<div id="main">
  <div id="top">
    <button class="hbtn" id="side-toggle" title="Show / hide chats">&#9776;</button>
    <span id="np-slot"><span>&#9834;</span><span id="np-text"></span></span>
    <span id="chat-title">New chat</span>
    <div id="clock">
      <div id="clk-time">--:--:--</div>
      <div id="clk-sub"><span id="clk-date"></span><span id="clk-wx" class="wx"></span></div>
    </div>
    <div id="topright">
      <span id="status"><i></i><span id="status-t"></span></span>
      <button class="hbtn" id="clk-toggle" title="Show / hide clock &amp; weather">&#9716;</button>
      <button class="hbtn" id="apps-toggle" title="Apps Ted has used">&#8862;</button>
    </div>
  </div>
  <div id="chips"></div>
  <div id="scroll"><div id="msgs">
    <div id="empty"><div class="big">What's on your mind?</div>
      Type below — or tap the mic to talk.</div>
  </div></div>
  <div id="inwrap">
    <div id="heard"></div>
    <div id="bar">
      <button class="ibtn" id="mic" title="Voice mode on/off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
        </svg>
      </button>
      <textarea id="input" rows="1" placeholder="Message Ted…"></textarea>
      <button class="ibtn" id="send" title="Send">&#8593;</button>
    </div>
  </div>
</div>

<div id="apps">
  <h3>OPEN APPS</h3>
  <div id="apps-list"><div id="apps-empty">Everything running on this Mac shows
    up here. A teal dot means Ted is using it. ✕ closes the app.</div></div>
</div>

<div id="ctxmenu"><button id="ctx-copy">Copy</button></div>

<div id="toast"><span id="toast-b"></span></div>

<div id="rempanel">
  <span class="x" onclick="tedHud.hideReminders()">×</span>
  <h3>SCHEDULED</h3><div id="remlist"></div>
</div>

<div id="mempanel">
  <header>TED'S MEMORY <span class="x" onclick="tedHud.hideMemory()">×</span></header>
  <iframe id="memframe"></iframe>
</div>

<script>
"use strict";
function inApp(){ return !!(window.pywebview && window.pywebview.api); }
var API='http://127.0.0.1:5175/api';

/* ── state ────────────────────────────────────────────────── */
var muted=true;                    // Ted now starts silent (chat-first)
var STATE_TEXT={idle:'READY',listening:'LISTENING',thinking:'THINKING',speaking:'SPEAKING'};
var currentChat=null;              // active session id (created lazily)
var pendingTurns=[];               // turns before the session exists
var turnCount=0, titled=false;
var streamEl=null, streamBuf='';
var lastStreamText=null;           // dedupe: app.py re-sends streamed replies
                                   // through addMessage after streaming ends
function _norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ── code highlighting (regex-based, good enough for a chat window) ── */
var _KW=('def return if elif else for while in not and or is None True False class '+
  'import from as try except finally with lambda pass break continue raise yield '+
  'function var let const new this typeof instanceof null undefined true false '+
  'async await print int str float list dict set tuple range len public private '+
  'static void string bool struct enum match case switch default do else').split(' ');
var _KWSET={}; _KW.forEach(function(k){ _KWSET[k]=1; });
function highlight(code){
  var out='', i=0, n=code.length;
  while(i<n){
    var c=code[i];
    if(c==='#'||(c==='/'&&code[i+1]==='/')){                  // comment → EOL
      var j=code.indexOf('\n',i); if(j===-1) j=n;
      out+='<span class="tok-cm">'+esc(code.slice(i,j))+'</span>'; i=j; continue;
    }
    if(c==='"'||c==="'"||c==='`'){                            // string
      var q=c, j2=i+1;
      while(j2<n&&(code[j2]!==q||code[j2-1]==='\\')) j2++;
      j2=Math.min(j2+1,n);
      out+='<span class="tok-st">'+esc(code.slice(i,j2))+'</span>'; i=j2; continue;
    }
    if(/[0-9]/.test(c)&&!/[A-Za-z_]/.test(code[i-1]||'')){    // number
      var j3=i; while(j3<n&&/[0-9.xa-fA-F_]/.test(code[j3])) j3++;
      out+='<span class="tok-nm">'+esc(code.slice(i,j3))+'</span>'; i=j3; continue;
    }
    if(/[A-Za-z_]/.test(c)){                                  // word
      var j4=i; while(j4<n&&/[A-Za-z0-9_]/.test(code[j4])) j4++;
      var w=code.slice(i,j4);
      if(_KWSET[w]) out+='<span class="tok-kw">'+w+'</span>';
      else if(code[j4]==='(') out+='<span class="tok-fn">'+esc(w)+'</span>';
      else out+=esc(w);
      i=j4; continue;
    }
    out+=esc(c); i++;
  }
  return out;
}
function codeboxHtml(lang,code){
  return '<div class="codebox"><div class="chead"><span>'+esc(lang||'code')+'</span>'+
    '<button class="copy" onclick="copyCode(this)">Copy</button></div>'+
    '<pre>'+highlight(code)+'</pre></div>';
}
function copyCode(btn){
  var pre=btn.parentElement.nextElementSibling;
  var text=pre.textContent;
  function done(){ btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(function(){ btn.textContent='Copy'; btn.classList.remove('done'); },1600); }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallback(); });
  } else fallback();
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    ta.remove();
  }
}

/* markdown-lite for Ted's messages: ```fences```, **bold**, `inline code`.
   An unclosed fence (mid-stream) renders as a live code box. */
function mdlite(s){
  s=String(s==null?'':s);
  var out='', pos=0;
  var re=/```([A-Za-z0-9+#-]*)\n?([\s\S]*?)(```|$)/g, m;
  while((m=re.exec(s))!==null){
    out+=inline(s.slice(pos,m.index).replace(/\n+$/,''));   // no gap above box
    out+=codeboxHtml(m[1],m[2].replace(/\n$/,''));
    pos=m.index+m[0].length;
    while(s[pos]==='\n') pos++;                             // no gap below box
  }
  out+=inline(s.slice(pos));
  return out;
  function inline(t){
    return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
                 .replace(/`([^`]+)`/g,'<code>$1</code>');
  }
}

/* ── chat rendering ───────────────────────────────────────── */
function hideEmpty(){ var e=$('empty'); if(e) e.style.display='none'; }
function scrollDown(){ var s=$('scroll'); s.scrollTop=s.scrollHeight; }

function copyText(text,btn){
  function done(){ if(!btn) return; var o=btn.textContent;
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(function(){ btn.textContent=o; btn.classList.remove('done'); },1500); }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,function(){ legacyCopy(text,done); });
  } else legacyCopy(text,done);
}
function legacyCopy(text,done){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.top='-1000px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); if(done) done(); }catch(e){}
  ta.remove();
}
function addBubble(role,text){
  hideEmpty();
  var d=document.createElement('div');
  d.className='m '+(role==='user'?'user':'ted');
  var b=document.createElement('div'); b.className='b';
  if(role==='user') b.textContent=text; else b.innerHTML=mdlite(text);
  d.appendChild(b);
  $('msgs').appendChild(d); scrollDown();
  return b;
}

/* ── server plumbing (chat history) ───────────────────────── */
var serverWarned=false;
function apiFetch(path,opts){
  return fetch(API+path,opts).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status+' '+path);
    return r.json();
  });
}
function checkServer(){
  /* If something old is squatting on 5175, chats silently vanish — say so. */
  apiFetch('/version').then(function(v){
    if(!v.chats) throw new Error('old server');
  }).catch(function(){
    if(serverWarned) return; serverWarned=true;
    tedHud.showIssue('Chat history is NOT saving — an old dashboard is using '+
      'port 5175. Close it (or restart your Mac) and relaunch Ted.');
  });
}
function recordTurn(role,text){
  if(!text||!text.trim()) return;
  turnCount++;
  if(currentChat==null){
    pendingTurns.push({role:role,content:text});
    if(role!=='user') return;             // create the session on first USER turn
    apiFetch('/chats',{method:'POST'}).then(function(j){
      if(j==null||j.id==null){ checkServer(); return; }
      currentChat=j.id;
      var flush=pendingTurns.slice(); pendingTurns=[];
      (function next(i){
        if(i>=flush.length){ refreshChats(); return; }
        apiFetch('/chats/'+currentChat+'/turns',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(flush[i])}).then(function(){ next(i+1); });
      })(0);
    }).catch(function(){});
    return;
  }
  apiFetch('/chats/'+currentChat+'/turns',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({role:role,content:text})}).catch(function(){});
}
function maybeSummarize(){
  if(currentChat==null) return;
  if(!titled || turnCount%8===0){
    apiFetch('/chats/'+currentChat+'/summarize',{method:'POST'}).then(function(j){
      if(j&&j.title){ titled=true; $('chat-title').textContent=j.title; refreshChats(); }
    }).catch(function(){});
  }
}
function relTime(iso){
  var d=new Date(String(iso).replace(' ','T')); if(isNaN(d)) return '';
  var mins=(Date.now()-d.getTime())/60000;
  if(mins<1) return 'now';
  if(mins<60) return Math.floor(mins)+'m ago';
  if(mins<60*24) return Math.floor(mins/60)+'h ago';
  var days=Math.floor(mins/(60*24));
  if(days===1) return 'yesterday';
  if(days<7) return days+'d ago';
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}
function refreshChats(){
  apiFetch('/chats').then(function(list){
    if(!Array.isArray(list)){ checkServer(); return; }
    var host=$('chats'); host.innerHTML='';
    list.forEach(function(c){
      if(c.turns===0 && c.id!==currentChat) return;   // hide empty stubs
      var d=document.createElement('div');
      d.className='chatitem'+(c.id===currentChat?' active':'');
      d.innerHTML='<div class="ct">'+esc(c.title)+'</div>'+
                  '<div class="cm">'+relTime(c.updated)+'</div>';
      d.title=c.summary||c.title;
      d.onclick=function(){ openChat(c.id); };
      host.appendChild(d);
    });
  }).catch(function(){});
}
function openChat(id){
  apiFetch('/chats/'+id).then(function(c){
    currentChat=id; titled=(c.title!=='New chat'); turnCount=c.turns.length;
    pendingTurns=[]; streamEl=null; streamBuf='';
    $('chat-title').textContent=c.title;
    $('msgs').innerHTML='';
    if(!c.turns.length) $('msgs').innerHTML=
      '<div id="empty"><div class="big">What\'s on your mind?</div>Type below — or tap the mic to talk.</div>';
    c.turns.forEach(function(t){ addBubble(t.role,t.content); });
    refreshChats();
  }).catch(function(){});
}
function newChat(){
  currentChat=null; titled=false; turnCount=0; pendingTurns=[];
  streamEl=null; streamBuf='';
  $('chat-title').textContent='New chat';
  $('msgs').innerHTML='<div id="empty"><div class="big">What\'s on your mind?</div>'+
                      'Type below — or tap the mic to talk.</div>';
  refreshChats();
}

/* ── side + apps panel state ──────────────────────────────── */
var appsUsed={};                 // app label → last time Ted touched it (ms)
var openApps=[];                 // live list of everything running on the Mac
var USED_WINDOW=10*60*1000;      // "Ted is using it" badge lasts 10 minutes

function closeAppFromPanel(name){
  if(!inApp()) return;
  if(!confirm('Close '+name+'?')) return;
  window.pywebview.api.close_app_direct(name).then(function(){
    openApps=openApps.filter(function(a){ return a!==name; });  // optimistic
    renderApps();               // apps_watch confirms within ~5s
  });
}
function renderApps(){
  var host=$('apps-list');
  if(!openApps.length){ return; }
  host.innerHTML='';
  var now=Date.now();
  var sorted=openApps.slice().sort(function(a,b){
    var ua=(appsUsed[a]&&now-appsUsed[a]<USED_WINDOW)?1:0;
    var ub=(appsUsed[b]&&now-appsUsed[b]<USED_WINDOW)?1:0;
    if(ua!==ub) return ub-ua;                 // Ted's apps float to the top
    return a.localeCompare(b);
  });
  sorted.forEach(function(name){
    var used=appsUsed[name]&&now-appsUsed[name]<USED_WINDOW;
    var d=document.createElement('div'); d.className='appitem'+(used?' used':'');
    d.innerHTML='<span class="dot"></span><span class="nm">'+esc(name)+'</span>'+
      (used?'<span class="tag">TED</span>':'')+
      '<span class="x" title="Close '+esc(name)+'">×</span>';
    d.querySelector('.x').onclick=function(){ closeAppFromPanel(name); };
    host.appendChild(d);
  });
}
function toggleSide(){
  var c=$('side').classList.toggle('collapsed');
  try{ localStorage.setItem('ted_side',c?'closed':'open'); }catch(e){}
}
function toggleApps(){
  $('apps').classList.toggle('open');
  $('apps-toggle').classList.remove('noted');
  renderApps();
}

/* ── clock / date / weather ───────────────────────────────── */
var clockOn=true;
try{ clockOn=(localStorage.getItem('ted_clock')!=='off'); }catch(e){}
function applyClock(){
  $('clock').classList.toggle('hidden',!clockOn);
  try{ localStorage.setItem('ted_clock',clockOn?'on':'off'); }catch(e){}
}
function tickClock(){
  if(!clockOn) return;
  var d=new Date();
  $('clk-time').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});
  $('clk-date').textContent=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
}
function fetchWeather(){
  if(!clockOn) return;
  apiFetch('/weather').then(function(w){
    if(w&&w.temp!=null) $('clk-wx').textContent=' · '+w.temp+'° '+(w.desc||'');
  }).catch(function(){ $('clk-wx').textContent=''; });
}
setInterval(tickClock,1000);
setInterval(fetchWeather,15*60*1000);

/* ── tedHud: the full API Python calls ────────────────────── */
var toastT=null, heardT=null;
var tedHud={
  setState:function(s){
    if(s==='error'||s==='offline') return;
    if(!(s in STATE_TEXT)) return;
    var st=$('status');
    if(s==='idle'){ st.className=''; st.querySelector('#status-t').textContent=''; }
    else{ st.className=s+' active'; st.querySelector('#status-t').textContent=STATE_TEXT[s]; }
  },
  addMessage:function(role,text){
    if(role==='ted'){
      if(streamEl){ return; }                    // streamed reply still rendering
      // app.py calls add_message with the full reply AFTER streaming it —
      // the streamed bubble is already on screen and recorded, so drop the
      // repeat. (Voice mode strips openers from the streamed copy, hence
      // the contains-check rather than strict equality.)
      if(lastStreamText!==null){
        var a=_norm(text), b=_norm(lastStreamText);
        if(a===b || a.indexOf(b)!==-1 || b.indexOf(a)!==-1){ lastStreamText=null; return; }
        lastStreamText=null;
      }
    }
    addBubble(role,text);
    recordTurn(role,text);
    if(role==='ted') maybeSummarize();
  },
  streamTedText:function(piece){
    if(!streamEl){ streamEl=addBubble('ted',''); streamBuf=''; }
    streamBuf+=piece;
    streamEl.innerHTML=mdlite(streamBuf);
    scrollDown();
  },
  endTedReply:function(){
    if(streamEl){
      var text=streamBuf;
      streamEl.innerHTML=mdlite(text);   // final render (closes any open code fence)
      streamEl=null; streamBuf='';
      lastStreamText=text;
      recordTurn('ted',text);
      maybeSummarize();
    }
  },
  showIssue:function(text){
    $('toast-b').textContent=text; $('toast').classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(function(){ $('toast').classList.remove('show'); },6000);
  },
  clearIssue:function(){ $('toast').classList.remove('show'); },
  setMuted:function(m){
    muted=!!m;
    $('mic').classList.toggle('on',!muted);
    $('mic').title=muted?'Voice mode off — click to talk':'Voice mode ON — click to mute';
    if(muted) tedHud.setState('idle');
  },
  flashHeard:function(text,final){
    var e=$('heard'); e.textContent=(final?'':'… ')+text; e.classList.add('show');
    clearTimeout(heardT); heardT=setTimeout(function(){ e.classList.remove('show'); },final?2500:4000);
  },

  /* timers / alarms — chips under the header */
  addTimer:function(rid,endMs,label){
    var host=$('chips');
    var c=document.createElement('span'); c.className='chip'; c.id='timer-'+rid;
    var lbl=document.createElement('span'); lbl.textContent=label||'timer';
    var t=document.createElement('span');
    var x=document.createElement('span'); x.className='x'; x.textContent='×';
    x.onclick=function(){ if(inApp()) window.pywebview.api.cancel_timer(rid); c.remove(); };
    c.appendChild(lbl); c.appendChild(t); c.appendChild(x); host.appendChild(c);
    (function tick(){
      var left=Math.max(0,Math.round((endMs-Date.now())/1000));
      var m=Math.floor(left/60), s=left%60;
      t.textContent=m+':'+(s<10?'0':'')+s;
      if(left>0&&document.getElementById('timer-'+rid)) setTimeout(tick,1000);
    })();
  },
  clearTimer:function(){ $('chips').querySelectorAll('.chip').forEach(function(c){
    if(c.id.indexOf('timer-')===0) c.remove(); }); },
  clearTimerById:function(rid){ var c=document.getElementById('timer-'+rid); if(c) c.remove(); },
  flashAlarm:function(){
    document.querySelectorAll('#chips .chip').forEach(function(c){ c.classList.add('alarm'); });
    setTimeout(function(){ document.querySelectorAll('#chips .chip').forEach(function(c){
      c.classList.remove('alarm'); }); },4000);
  },

  /* reminders dropdown */
  showReminders:function(items){
    var host=$('remlist'); host.innerHTML='';
    (items||[]).forEach(function(r){
      var d=document.createElement('div');
      d.textContent=(typeof r==='string')?r:(r.text||r.label||JSON.stringify(r));
      host.appendChild(d);
    });
    $('rempanel').classList.add('open');
  },
  hideReminders:function(){ $('rempanel').classList.remove('open'); },

  /* health dots + voice label removed from the UI — keep the API alive */
  setHealth:function(){}, setVoice:function(){},

  /* now playing — pill at the top left. Music playing = Ted using Spotify,
     which also covers the intent path that skips _dispatch_tool. */
  setNowPlaying:function(np){
    var text=(typeof np==='string')?np:((np&&np.text)||'');
    $('np-text').textContent=text;
    $('np-slot').classList.toggle('show',!!text);
    if(text){ appsUsed['Spotify']=Date.now(); renderApps(); }
  },

  /* live open-apps feed from apps_watch (every ~5s, on change) */
  setOpenApps:function(apps){
    if(Array.isArray(apps)){ openApps=apps; renderApps(); }
  },

  /* Ted touched a tool — mark the matching app as in use */
  noteAppUse:function(tool){
    var map={play_music:'Spotify',play_playlist:'Spotify',spotify_control:'Spotify',
      calendar_get:'Calendar',calendar_add:'Calendar',
      get_emails:'Mail',read_email:'Mail',email_action:'Mail',send_email:'Mail',
      send_message:'Messages',notes_add:'Notes',notes_get:'Notes',
      set_reminder:'Reminders',get_reminders:'Reminders',
      get_weather:'Weather',search_knowledge:'Knowledge',add_knowledge:'Knowledge',
      screen_describe:'Screen'};
    var label=map[tool]; if(!label) return;
    appsUsed[label]=Date.now();
    renderApps();
    if(!$('apps').classList.contains('open')) $('apps-toggle').classList.add('noted');
  },

  /* clock widget — Ted can toggle this himself via the toggle_clock tool */
  toggleClock:function(mode){
    if(mode==='on') clockOn=true;
    else if(mode==='off') clockOn=false;
    else clockOn=!clockOn;
    applyClock();
    if(clockOn){ tickClock(); fetchWeather(); }
  },

  /* memory overlay */
  showMemory:function(){
    var f=$('memframe'); if(!f.src) f.src='http://127.0.0.1:5175';
    $('mempanel').classList.add('open');
  },
  hideMemory:function(){ $('mempanel').classList.remove('open'); },
  toggleMemory:function(){
    if($('mempanel').classList.contains('open')) tedHud.hideMemory();
    else tedHud.showMemory();
  },

  /* compat stubs — Python still calls these; nothing to show in chat mode */
  pushAmplitude:function(){}, clearAmplitude:function(){},
  setAttention:function(){}, micIdle:function(){},
  setMode:function(){}, setVoiceMode:function(){}, toggleMode:function(){},
  setConversations:function(){}, setWeather:function(){},
  showChat:function(){}, hideChat:function(){}, toggleChat:function(){},
};
window.tedHud=tedHud;

/* ── controls ─────────────────────────────────────────────── */
function sendMsg(){
  var input=$('input');
  var txt=input.value.trim(); if(!txt) return;
  input.value=''; input.style.height='auto';
  addBubble('user',txt);
  recordTurn('user',txt);
  tedHud.setState('thinking');
  if(inApp()) window.pywebview.api.ask(txt);
}
$('send').onclick=sendMsg;
$('input').addEventListener('keydown',function(e){
  e.stopPropagation();
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMsg(); }
});
$('input').addEventListener('input',function(){
  this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,150)+'px';
});
$('mic').onclick=function(){
  if(inApp()) window.pywebview.api.toggle_mute().then(function(m){ tedHud.setMuted(m); });
  else tedHud.setMuted(!muted);
};
$('newchat').onclick=newChat;
$('membtn').onclick=function(){ tedHud.toggleMemory(); };
$('clk-toggle').onclick=function(){ tedHud.toggleClock(); };
$('side-toggle').onclick=toggleSide;
$('apps-toggle').onclick=toggleApps;

/* ── copying selected text ────────────────────────────────────
   pywebview's macOS WKWebView has no Edit menu, so the system Cmd+C and the
   native right-click "Copy" never reach the page — the context menu falls
   back to Services only. Both are wired manually here. */
function selectedText(){
  var s=window.getSelection();
  return s?String(s).trim():'';
}
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&(e.key==='c'||e.key==='C')){
    var t=selectedText();
    if(t){ copyText(t); e.preventDefault(); }
  }
},true);
document.addEventListener('contextmenu',function(e){
  var t=selectedText();
  if(!t) return;                 // no selection → leave the native menu alone
  e.preventDefault();
  var m=$('ctxmenu');
  m.classList.add('open');
  var mw=140, mh=36;
  m.style.left=Math.min(e.clientX,window.innerWidth-mw)+'px';
  m.style.top=Math.min(e.clientY,window.innerHeight-mh)+'px';
});
$('ctx-copy').onclick=function(){
  copyText(selectedText());
  $('ctxmenu').classList.remove('open');
};
document.addEventListener('mousedown',function(e){
  if(!$('ctxmenu').contains(e.target)) $('ctxmenu').classList.remove('open');
});
setInterval(function(){ if($('apps').classList.contains('open')) renderApps(); },60000);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('mempanel').classList.contains('open')) tedHud.hideMemory();
});

/* ── boot ─────────────────────────────────────────────────── */
(function(){
  tedHud.setMuted(true);          // Ted starts silent; mic button turns voice on
  var st=$('status');
  if(inApp()){ st.className='active'; $('status-t').textContent='STARTING'; }
  else{ st.className='active'; $('status-t').textContent='DEMO'; }
  window.addEventListener('pywebviewready',function(){
    st.className=''; $('status-t').textContent='';   // quiet until he's busy
  });
  /* the chat server (port 5175) boots in a thread — retry until it's up */
  var tries=0;
  (function ping(){
    apiFetch('/version').then(function(v){
      if(!v.chats){ checkServer(); return; }
      refreshChats();
    }).catch(function(e){
      if(String(e).indexOf('HTTP')!==-1){ checkServer(); return; }  // old server: up but no /version
      if(++tries<20) setTimeout(ping,1000);
      else checkServer();
    });
  })();
  setInterval(refreshChats,60000);   // keep sidebar timestamps fresh
  applyClock(); tickClock();
  setTimeout(fetchWeather,2500);     // give the local server a moment first
  try{ if(localStorage.getItem('ted_side')==='closed') $('side').classList.add('collapsed'); }catch(e){}
  $('input').focus();
})();
</script>
