<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ted</title>
<style>
:root{
  --bg:#151717; --side:#1a1d1d; --panel:#212525; --panel2:#293030;
  --line:#2e3434; --text:#e9edec; --dim:#939b99;
  --accent:#16DEDE;            /* teal — Charlie's pick */
  --accent-soft:rgba(22,222,222,.13);
  --ok:#5fc492; --warn:#dcab50; --down:#d95850;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
/* NOTE: no user-select:none anywhere near body — WebKit won't let children
   re-enable selection under a none ancestor, which silently killed copying. */
body{background:var(--bg);color:var(--text);overflow:hidden;
  font:14px/1.55 -apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;
  display:flex}
button,#side,#top,#sidefoot{-webkit-user-select:none;user-select:none}

/* ── the collapse component, used by both side panels ──────────
   One set of rules for the chat panel and the computer panel, mirrored. The
   panel is a row: a full-width body plus a 16px rail on its INNER edge. The
   panel animates its own width down to the rail and no further, so the rail is
   always on screen to reopen with, and the body is only ever clipped — never
   unmounted. Nothing is rebuilt on reopen and no scroll position is lost.

   The body is pinned to the panel's OUTER edge and the rail to its inner one,
   both absolutely. That is what makes the collapse a reveal: the body stays put
   in the window at a fixed width while the panel's width — and therefore the
   clip — animates over it, so no text reflows on the way and the rail is never
   the thing that gets clipped away. */
.panel{flex:none;position:relative;background:var(--side);overflow:hidden;
  transition:width .25s ease}
.panel-body{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;
  overflow:hidden}
.panel-rail{position:absolute;top:0;bottom:0;width:16px;z-index:2;
  cursor:pointer;border:none;background:var(--side);
  color:var(--dim);font-size:11px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;
  transition:background .18s,color .18s}
.panel-rail:hover{background:var(--panel);color:var(--accent)}
/* Ted used an app while the panel was shut. The rail is the only thing on
   screen to say so, so it is what lights up. */
.panel-rail.noted{color:var(--accent);background:var(--accent-soft)}

/* ── sidebar ─────────────────────────────────────────────── */
#side{width:266px;border-right:1px solid var(--line)}   /* 250 body + 16 rail */
#side.collapsed{width:16px}
#side .panel-body{left:0;width:250px}
#side .panel-rail{right:0;border-left:1px solid var(--line)}
#side .panel-body>*{min-width:230px}

/* right panel — live computer hierarchy. Starts collapsed, so by default the
   only part of it on screen is its 16px rail. */
#apps{width:336px;border-left:1px solid var(--line)}    /* 320 body + 16 rail */
#apps.collapsed{width:16px}
#apps .panel-body{right:0;width:320px}
#apps .panel-rail{left:0;border-right:1px solid var(--line)}
#apps .panel-body>*{min-width:300px}
.apps-head{padding:15px 15px 9px;border-bottom:1px solid var(--line)}
.apps-head h3{font-size:10px;letter-spacing:.22em;color:var(--dim)}
#apps-summary{font-size:11px;color:var(--dim);margin-top:3px}
#apps-list{padding:0 10px 10px;overflow-y:auto;flex:1}
#apps-list::-webkit-scrollbar{width:4px}
#apps-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.appitem{border-radius:9px;font-size:12.5px;margin-top:7px;background:var(--panel);
  border:1px solid transparent;overflow:hidden}
.appitem.front{border-color:rgba(22,222,222,.3)}
.apphead{display:flex;align-items:center;gap:8px;padding:8px 9px;cursor:pointer}
.appitem .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.appitem.used .dot,.appitem.front .dot{background:var(--accent)}
.appitem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appitem .meta{font-size:10px;color:var(--dim);margin-left:auto;white-space:nowrap}
.appitem .tag{font-size:8.5px;color:var(--accent);letter-spacing:.06em;flex:none;
  border:1px solid rgba(22,222,222,.3);border-radius:8px;padding:0 4px}
.appitem .x{margin-left:auto;cursor:pointer;color:var(--dim);flex:none;
  padding:0 3px;border-radius:4px;font-size:13px}
.appitem .x:hover{color:var(--down)}
.appchildren{display:none;padding:0 8px 8px 24px;border-top:1px solid rgba(255,255,255,.035)}
.appitem.expanded .appchildren{display:block}
.subitem{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.045);min-width:0}
.subitem:last-child{border-bottom:0}
.subtop{display:flex;gap:6px;align-items:baseline;min-width:0}
.subitem .mark{color:var(--dim);font-size:9px;flex:none}
.subitem.active .mark{color:var(--accent)}
.subitem .st{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subitem .ss{font-size:9.8px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-left:15px}
.branch{color:var(--accent);font:9.5px ui-monospace,Menlo,monospace;background:var(--accent-soft);
  padding:1px 5px;border-radius:5px;margin-left:auto;max-width:105px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#apps-empty{padding:8px 16px;color:var(--dim);font-size:12px;line-height:1.6}
#side .brand{padding:18px 16px 10px;display:flex;align-items:baseline;gap:8px}
#side .brand .t{font-size:15px;font-weight:650;letter-spacing:.18em}
#side .brand .v{font-size:10px;color:var(--dim)}
#newchat{margin:6px 12px 10px;padding:9px 12px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;
  font-size:13px;text-align:left;transition:all .2s}
#newchat:hover{border-color:var(--accent);color:var(--accent)}
#chats{flex:1;overflow-y:auto;padding:0 8px 8px}
#chats::-webkit-scrollbar{width:4px}
#chats::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.chatitem{position:relative;padding:8px 28px 8px 10px;border-radius:8px;cursor:pointer;
  margin-bottom:2px;border-left:2px solid transparent}
.chatitem:hover{background:var(--panel)}
.chatitem.active{background:var(--panel);border-left-color:var(--accent)}
.chatitem .ct{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatitem .cm{font-size:11px;color:var(--dim);margin-top:1px}
/* Delete is a soft delete, so it does not need a confirm dialog — it needs to
   be undoable, and it is (the memory dashboard lists hidden threads and can
   restore them). It stays out of sight until the row is hovered so a list of
   chats does not read as a list of × buttons. */
.chatitem .del{position:absolute;right:5px;top:50%;transform:translateY(-50%);
  opacity:0;border:none;background:transparent;color:var(--dim);cursor:pointer;
  font:inherit;font-size:14px;line-height:1;padding:3px 6px;border-radius:5px;
  transition:opacity .15s,color .15s,background .15s}
.chatitem:hover .del,.chatitem .del:focus{opacity:1}
.chatitem .del:hover{color:var(--down);background:rgba(217,88,80,.15)}
#sidefoot{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
#sidefoot .row{display:flex;align-items:center;gap:10px;margin-top:6px}
#membtn,#diagbtn{cursor:pointer;padding:6px 0;color:var(--dim);transition:color .2s}
#membtn:hover,#diagbtn:hover{color:var(--text)}
.hd{display:flex;align-items:center;gap:4px;font-size:10px;letter-spacing:.08em}
.hd i{width:6px;height:6px;border-radius:50%;background:var(--dim);display:inline-block}
.hd i.on{background:var(--ok)}
.hd i.off{background:var(--down)}

/* ── main column ─────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
/* Everything in the header is a real flex item. Nothing is absolutely
   positioned any more: the clock used to be pinned to the centre of #top with
   left:50%/translate, which meant that opening the apps panel narrowed #main
   and slid the clock straight under the token widget. Flex items cannot
   overlap — they shrink and, at the narrowest widths, drop out in the order
   set by the media queries below. */
#top{padding:10px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;min-height:58px}
#chat-title{display:none}
.hbtn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;
  padding:5px 8px;flex:none;border-radius:7px;transition:color .2s}
.hbtn:hover{color:var(--text)}
.hbtn.noted{color:var(--accent)}
#status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);
  flex:none;opacity:0;transition:opacity .25s}
#status.active{opacity:1}
#status i{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:background .3s}
#status.listening i{background:var(--ok)}
#status.thinking i{background:var(--accent)}
#status.speaking i{background:var(--accent)}
#status.thinking i{animation:thinkStatus .85s ease-in-out infinite alternate}
@keyframes thinkStatus{from{transform:scale(.75);opacity:.45}to{transform:scale(1.45);opacity:1}}

/* now playing — top left, out of the chat's way */
/* The now-playing pill, with skip directly under it. Stacked rather than
   inline: Charlie asked for skip *under* the song button, and a second pill
   beside the first would push the clock off centre every time music started. */
#np-stack{display:none;flex-direction:column;align-items:flex-start;gap:3px;
  flex:0 1 auto;min-width:0}
#np-stack.show{display:flex}
#np-slot{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:5px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:3px 11px;
  max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;min-width:0}
#np-text{overflow:hidden;text-overflow:ellipsis}
/* Same local transport path as the strip above the input box: straight to
   Python, no model, no token, nothing that can narrate a skip that did not
   happen. */
#np-skip{background:transparent;border:1px solid var(--line);border-radius:11px;
  color:var(--dim);cursor:pointer;font:inherit;font-size:10px;letter-spacing:.06em;
  padding:1px 9px;line-height:1.5;transition:color .15s,border-color .15s,background .15s}
#np-skip:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

/* clock — centred by equal auto margins rather than by absolute positioning,
   so it is pushed aside by its neighbours instead of drawn on top of them.
   min-width:0 lets it give up space before anything is clipped. */
#clock{margin:0 auto;text-align:center;line-height:1.35;min-width:0;
  white-space:nowrap;overflow:hidden}
#clk-time{font:600 16px ui-monospace,Menlo,monospace;letter-spacing:.05em}
#clk-sub{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
#clk-sub .wx{color:var(--accent)}
/* The right-hand stack. flex-wrap:nowrap with each child flex:none keeps the
   budget gauge, the status lamp and the panel buttons on one line at any width
   the window can actually take. */
#topright{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none;
  flex-wrap:nowrap}
#chips{display:flex;gap:8px;padding:0 22px;flex-wrap:wrap}
.chip{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:3px 12px;font-size:11.5px;color:var(--dim);display:flex;gap:6px;align-items:center}
.chip.alarm{border-color:var(--accent);color:var(--accent)}
.chip .x{cursor:pointer}

/* messages */
#scroll{flex:1;overflow-y:auto;-webkit-user-select:text;user-select:text}
#scroll::-webkit-scrollbar{width:6px}
#scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
#msgs{max-width:740px;margin:0 auto;padding:26px 24px 30px}
.m{margin:16px 0;line-height:1.6;position:relative}
.thinking-row{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:12px;
  margin:18px 0 12px;min-height:26px}
.thinking-dots{display:inline-flex;gap:4px;align-items:center}
.thinking-dots i{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:thinkingDot 1.05s ease-in-out infinite}
.thinking-dots i:nth-child(2){animation-delay:.14s}
.thinking-dots i:nth-child(3){animation-delay:.28s}
@keyframes thinkingDot{0%,70%,100%{transform:translateY(0);opacity:.3}
  35%{transform:translateY(-5px);opacity:1}}
.thinking-label{font-variant-numeric:tabular-nums}
/* belt-and-braces selection: some pywebview/WebKit builds ignore text_select */
#msgs,.m,.m .b,.m .b *{-webkit-user-select:text!important;user-select:text!important;
  cursor:auto;-webkit-touch-callout:default}
/* right-click copy menu (WKWebView's native menu has no Copy item) */
#ctxmenu{position:fixed;z-index:60;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:4px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#ctxmenu.open{display:block}
#ctxmenu button{display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--text);font:inherit;font-size:13px;padding:6px 16px;border-radius:5px;cursor:pointer}
#ctxmenu button:hover{background:var(--accent);color:#0c2b2b}
.m.user{display:flex;justify-content:flex-end}
.m.user .b{background:var(--panel2);padding:9px 15px;border-radius:16px 16px 4px 16px;
  max-width:82%;white-space:pre-wrap}
.m.ted .b{white-space:pre-wrap;color:#d8d5d1}
.m.ted .b code{background:var(--panel);border-radius:4px;padding:1px 5px;
  font:12.5px ui-monospace,Menlo,monospace}
.m.ted .b b{color:var(--text)}

/* fenced code blocks — editor-style box with copy button */
.codebox{background:#1a1a1a;border:1px solid var(--line);border-radius:10px;
  margin:10px 0;overflow:hidden}
.codebox .chead{display:flex;justify-content:space-between;align-items:center;
  padding:6px 12px;background:#202020;border-bottom:1px solid var(--line);
  font-size:11px;color:var(--dim)}
.codebox .copy{cursor:pointer;background:none;border:none;color:var(--dim);
  font:inherit;padding:2px 6px;border-radius:5px;transition:color .2s}
.codebox .copy:hover{color:var(--text)}
.codebox .copy.done{color:var(--ok)}
.codebox pre{margin:0;padding:12px 14px;overflow-x:auto;white-space:pre;
  font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#d8d5d1}
.codebox pre::-webkit-scrollbar{height:5px}
.codebox pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.tok-kw{color:#c586b6}   /* keywords   — soft magenta */
.tok-st{color:#a8bf8f}   /* strings    — sage green   */
.tok-cm{color:#6f6d6a;font-style:italic}  /* comments */
.tok-nm{color:#c9a35c}   /* numbers    — amber        */
.tok-fn{color:#8fb4c9}   /* calls/defs — steel blue   */
#empty{color:var(--dim);text-align:center;margin-top:16vh;line-height:2}
#empty .big{font-size:19px;color:var(--text)}

/* input */
#inwrap{flex:none;padding:10px 24px 18px}
#heard{max-width:740px;margin:0 auto 6px;font-size:12px;color:var(--dim);
  min-height:16px;padding:0 4px;opacity:0;transition:opacity .25s}
#heard.show{opacity:1}
#bar{max-width:740px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
  background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 10px}
#bar:focus-within{border-color:#3a3a3a}
#input{flex:1;background:transparent;border:none;outline:none;color:var(--text);
  font:inherit;padding:6px 8px;resize:none;max-height:150px;
  -webkit-user-select:text;user-select:text}
#input::placeholder{color:var(--dim)}
.ibtn{width:36px;height:36px;flex:none;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:transparent;color:var(--dim);transition:all .2s}
.ibtn:hover{color:var(--text)}
#send{background:var(--accent);color:#0c2b2b}
#send:disabled{background:var(--panel2);color:var(--dim);cursor:default}
#mic{border:1px solid var(--line);color:var(--dim)}
#mic:hover{border-color:var(--accent);color:var(--accent)}
#mic.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);
  animation:micpulse 1.8s ease-in-out infinite}
#mic svg{width:17px;height:17px}
/* Transcribe: the mic is live but Ted stays silent, so it pulses like the mic
   button and is deliberately a different colour — the two are not the same
   state and must not look like they are. */
/* Now playing: hidden entirely unless Spotify has something to report, so it
   never occupies space to say "nothing". */
#nowplaying{display:none;align-items:center;gap:6px;margin:0 4px 6px;
  padding:5px 10px;border-radius:9px;background:var(--panel2);
  font-size:11.5px;color:var(--dim)}
#nowplaying.show{display:flex}
.tbtn{border:none;background:transparent;color:var(--dim);cursor:pointer;
  font-size:10px;padding:2px 5px;border-radius:5px;line-height:1;
  transition:color .15s,background .15s}
.tbtn:hover{color:var(--accent);background:var(--accent-soft)}
#nptext{margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#transcribe{border:1px solid var(--line);color:var(--dim)}
#transcribe:hover{border-color:var(--text);color:var(--text)}
#transcribe.on{background:rgba(224,168,74,.16);color:#e0a84a;border-color:#e0a84a;
  animation:micpulse 1.8s ease-in-out infinite}
#transcribe svg{width:17px;height:17px}
@keyframes micpulse{
  0%,100%{box-shadow:0 0 0 0 rgba(22,222,222,.35)}
  50%{box-shadow:0 0 0 7px rgba(22,222,222,0)}
}

/* toast */
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--panel);border:1px solid var(--warn);color:var(--text);border-radius:10px;
  padding:9px 16px;font-size:12.5px;opacity:0;pointer-events:none;transition:all .3s;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%)}
/* A memory toast is a different kind of message from a problem: it reports
   something that went right, and it is the handle for fixing it if it did not.
   Teal instead of amber, and clickable — hence pointer-events back on. */
#toast.memory{border-color:var(--accent);cursor:pointer;pointer-events:auto}
#toast.memory:hover{background:var(--panel2);border-color:var(--accent)}
#toast .mlabel{color:var(--accent);letter-spacing:.06em;font-size:10.5px;
  text-transform:uppercase;margin-right:7px}
#toast .mhint{color:var(--dim);font-size:10.5px;margin-left:9px}

/* reminders dropdown */
#rempanel{position:fixed;top:60px;right:20px;z-index:25;background:var(--side);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:280px;display:none}
#rempanel.open{display:block}
#rempanel h3{font-size:10px;letter-spacing:.25em;color:var(--dim);margin-bottom:8px}
#rempanel .x{float:right;cursor:pointer}
#remlist div{font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
#remlist div:last-child{border:none}

/* Header crowding is driven by the width of #top itself, not the window: opening
   the apps panel narrows #main without changing the viewport, so a media query
   would miss exactly the case A5 is about. A ResizeObserver sets these classes
   from the measured width instead. Order of sacrifice, least useful first:
   the now-playing pill (the transport strip above the input box says the same
   thing), then the clock. The budget gauge and status lamp never drop. */
#top.tight #np-stack{display:none}
#top.xtight #clock{display:none}

/* live token budget + which brain answered */
#budget{display:flex;align-items:center;gap:7px;margin-right:10px;font-size:11px;
  color:var(--dim);flex:none}
#bud-bar{width:66px;height:5px;border-radius:3px;background:rgba(255,255,255,.09);
  overflow:hidden;display:inline-block}
#bud-bar i{display:block;height:100%;width:0;background:#3ecf8e;
  transition:width .5s ease,background .5s ease}
#bud-bar.warn i{background:#e0b341}
#bud-bar.bad i{background:#e0685f}
#bud-txt{font-variant-numeric:tabular-nums;min-width:76px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;
  background:#4a453f;transition:background .3s,box-shadow .3s}
.dot.cloud {background:#3ecf8e;box-shadow:0 0 6px rgba(62,207,142,.6)}
.dot.local {background:#e0b341;box-shadow:0 0 6px rgba(224,179,65,.6)}
.dot.reflex{background:#8fb8e0;box-shadow:0 0 6px rgba(143,184,224,.55)}
.dot.dead  {background:#e0685f;box-shadow:0 0 6px rgba(224,104,95,.6)}
/* Cloud dropped to the local brain on this turn: pulse so it is noticed
   without a toast interrupting the conversation. */
.dot.fell{animation:fellback 1s ease-out 3}
@keyframes fellback{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(224,179,65,.75)}
  50%{transform:scale(1.55);box-shadow:0 0 0 7px rgba(224,179,65,0)}
  100%{transform:scale(1);box-shadow:0 0 0 0 rgba(224,179,65,0)}
}
/* per-reply footer: how long it took, what it cost, who answered */
.meta{font-size:10.5px;color:var(--dim);opacity:.62;margin:3px 0 0 2px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.meta .sep{opacity:.45;margin:0 5px}
.meta .warn{color:#e0b341}

/* memory overlay */
#mempanel{position:fixed;inset:0;z-index:40;background:#0f1115;display:none;flex-direction:column}
#mempanel.open{display:flex}
#mempanel header{padding:12px 18px;font-size:10px;letter-spacing:.3em;color:var(--dim);
  display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
#mempanel header .x{cursor:pointer;font-size:15px;color:var(--text);letter-spacing:0}
#memframe{flex:1;border:none;width:100%;background:#0f1115}

/* diagnostics overlay — same shell as memory, so the two behave identically */
#diagpanel{position:fixed;inset:0;z-index:40;background:#171614;display:none;flex-direction:column}
#diagpanel.open{display:flex}
#diagpanel header{padding:12px 18px;font-size:10px;letter-spacing:.3em;color:var(--dim);
  display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}

<body>

<div id="side" class="panel">
  <div class="panel-body">
    <div class="brand"><span class="t">TED</span><span class="v" id="hdr-v">v4</span></div>
    <button id="newchat">+ New chat</button>
    <div id="chats"></div>
    <div id="sidefoot">
      <div id="membtn" title="Ted's memory">&#9783; Memory</div>
      <div id="diagbtn" title="Per-turn timings, tokens, which brain answered, and real errors">&#9201; Diagnostics</div>
    </div>
  </div>
  <button class="panel-rail" id="side-rail"></button>
</div>

<div id="main">
  <div id="top">
    <div id="np-stack">
      <span id="np-slot"><span>&#9834;</span><span id="np-text"></span></span>
      <button id="np-skip" title="Skip this song — goes straight to Spotify, costs nothing">&#9654;&#9654; SKIP</button>
    </div>
    <span id="chat-title">New chat</span>
    <div id="clock">
      <div id="clk-time">--:--:--</div>
      <div id="clk-sub"><span id="clk-date"></span><span id="clk-wx" class="wx"></span></div>
    </div>
    <div id="topright">
      <!-- The number that decides whether the next message gets answered by
           the cloud at all. It was only visible in the diagnostics panel,
           which is the one place you are not looking while typing. -->
      <span id="budget" title="Tokens used this minute against your account's limit">
        <span id="brain" class="dot" title="Which brain answered last"></span>
        <span id="bud-bar"><i style="width:0"></i></span>
        <span id="bud-txt" class="mono">–</span>
      </span>
      <span id="status"><i></i><span id="status-t"></span></span>
    </div>
  </div>
  <div id="chips"></div>
  <div id="scroll"><div id="msgs">
    <div id="empty"><div class="big">What's on your mind?</div>
      Type below — or tap the mic to talk.</div>
  </div></div>
  <div id="inwrap">
    <!-- Transport without the model in the loop: these call Python directly,
         so a skip costs no tokens and cannot be narrated into a lie. -->
    <div id="nowplaying">
      <button class="tbtn" id="tprev" title="Previous">&#9664;&#9664;</button>
      <button class="tbtn" id="tplay" title="Play / pause">&#9654;</button>
      <button class="tbtn" id="tnext" title="Next">&#9654;&#9654;</button>
      <span id="nptext"></span>
    </div>
    <div id="heard"></div>
    <div id="bar">
      <button class="ibtn" id="mic" title="Voice mode on/off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
        </svg>
      </button>
      <textarea id="input" rows="1" placeholder="Message Ted…"></textarea>
      <!-- Mic on, speakers off: dictate into the box instead of typing.
           A slashed mic would be the obvious icon and the wrong one — it reads
           as "mic off", which is the opposite of what this does. Captions say
           speech-becomes-text, which is exactly the promise.
           Sits immediately left of Send: it is the other way of filling this
           box, so it belongs next to the button that empties it, not off past
           the voice toggle where it read as a second mic. -->
      <button class="ibtn" id="transcribe" title="Dictate into the box — Ted won't speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="5" width="19" height="14" rx="3"/>
          <line x1="6.5" y1="10.5" x2="11" y2="10.5"/>
          <line x1="13.5" y1="10.5" x2="17.5" y2="10.5"/>
          <line x1="6.5" y1="14" x2="9" y2="14"/>
          <line x1="11.5" y1="14" x2="17.5" y2="14"/>
        </svg>
      </button>
      <button class="ibtn" id="send" title="Send">&#8593;</button>
    </div>
  </div>
</div>

<div id="apps" class="panel collapsed">
  <button class="panel-rail" id="apps-rail"></button>
  <div class="panel-body">
    <div class="apps-head"><h3>COMPUTER</h3><div id="apps-summary">Reading live state…</div></div>
    <div id="apps-list"><div id="apps-empty">Apps, windows, browser tabs, and terminal
      branches appear here as macOS confirms them.</div></div>
  </div>
</div>

<div id="ctxmenu"><button id="ctx-copy">Copy</button></div>

<div id="toast"><span id="toast-b"></span></div>

<div id="rempanel">
  <span class="x" onclick="tedHud.hideReminders()">×</span>
  <h3>SCHEDULED</h3><div id="remlist"></div>
</div>

<div id="mempanel">
  <header>TED'S MEMORY <span class="x" onclick="tedHud.hideMemory()">×</span></header>
  <iframe id="memframe"></iframe>
</div>

<div id="diagpanel">
  <header>DIAGNOSTICS <span class="x" onclick="tedHud.hideDiagnostics()">×</span></header>
  <iframe id="diagframe"></iframe>
</div>

<script>
"use strict";
function inApp(){ return !!(window.pywebview && window.pywebview.api); }
var API='http://127.0.0.1:5175/api';

/* ── state ────────────────────────────────────────────────── */
var muted=true;                    // Ted now starts silent (chat-first)
var transcribing=false;            // mic on, speakers off — dictation into the box
var STATE_TEXT={idle:'READY',listening:'LISTENING',thinking:'THINKING',speaking:'SPEAKING'};
var currentChat=null;              // active session id (created lazily)
var chatCreatePromise=null;        // one in-flight lazy session creation
var chatSaveQueue=Promise.resolve();
var chatEpoch=0;                   // prevents an old save crossing into New chat
var turnCount=0, titled=false;
var streamEl=null, streamBuf='';
var thinkingEl=null, thinkingTimer=null, thinkingT0=0;
var lastStreamText=null;           // dedupe: app.py re-sends streamed replies
                                   // through addMessage after streaming ends
function _norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ── code highlighting (regex-based, good enough for a chat window) ── */
var _KW=('def return if elif else for while in not and or is None True False class '+
  'import from as try except finally with lambda pass break continue raise yield '+
  'function var let const new this typeof instanceof null undefined true false '+
  'async await print int str float list dict set tuple range len public private '+
  'static void string bool struct enum match case switch default do else').split(' ');
var _KWSET={}; _KW.forEach(function(k){ _KWSET[k]=1; });
function highlight(code){
  var out='', i=0, n=code.length;
  while(i<n){
    var c=code[i];
    if(c==='#'||(c==='/'&&code[i+1]==='/')){                  // comment → EOL
      var j=code.indexOf('\n',i); if(j===-1) j=n;
      out+='<span class="tok-cm">'+esc(code.slice(i,j))+'</span>'; i=j; continue;
    }
    if(c==='"'||c==="'"||c==='`'){                            // string
      var q=c, j2=i+1;
      while(j2<n&&(code[j2]!==q||code[j2-1]==='\\')) j2++;
      j2=Math.min(j2+1,n);
      out+='<span class="tok-st">'+esc(code.slice(i,j2))+'</span>'; i=j2; continue;
    }
    if(/[0-9]/.test(c)&&!/[A-Za-z_]/.test(code[i-1]||'')){    // number
      var j3=i; while(j3<n&&/[0-9.xa-fA-F_]/.test(code[j3])) j3++;
      out+='<span class="tok-nm">'+esc(code.slice(i,j3))+'</span>'; i=j3; continue;
    }
    if(/[A-Za-z_]/.test(c)){                                  // word
      var j4=i; while(j4<n&&/[A-Za-z0-9_]/.test(code[j4])) j4++;
      var w=code.slice(i,j4);
      if(_KWSET[w]) out+='<span class="tok-kw">'+w+'</span>';
      else if(code[j4]==='(') out+='<span class="tok-fn">'+esc(w)+'</span>';
      else out+=esc(w);
      i=j4; continue;
    }
    out+=esc(c); i++;
  }
  return out;
}
function codeboxHtml(lang,code){
  return '<div class="codebox"><div class="chead"><span>'+esc(lang||'code')+'</span>'+
    '<button class="copy" onclick="copyCode(this)">Copy</button></div>'+
    '<pre>'+highlight(code)+'</pre></div>';
}
function copyCode(btn){
  var pre=btn.parentElement.nextElementSibling;
  var text=pre.textContent;
  function done(){ btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(function(){ btn.textContent='Copy'; btn.classList.remove('done'); },1600); }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallback(); });
  } else fallback();
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    ta.remove();
  }
}

/* markdown-lite for Ted's messages: ```fences```, **bold**, `inline code`.
   An unclosed fence (mid-stream) renders as a live code box. */
function mdlite(s){
  s=String(s==null?'':s);
  var out='', pos=0;
  var re=/```([A-Za-z0-9+#-]*)\n?([\s\S]*?)(```|$)/g, m;
  while((m=re.exec(s))!==null){
    out+=inline(s.slice(pos,m.index).replace(/\n+$/,''));   // no gap above box
    out+=codeboxHtml(m[1],m[2].replace(/\n$/,''));
    pos=m.index+m[0].length;
    while(s[pos]==='\n') pos++;                             // no gap below box
  }
  out+=inline(s.slice(pos));
  return out;
  function inline(t){
    return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
                 .replace(/`([^`]+)`/g,'<code>$1</code>');
  }
}

/* ── chat rendering ───────────────────────────────────────── */
function hideEmpty(){ var e=$('empty'); if(e) e.style.display='none'; }
function scrollDown(){ var s=$('scroll'); s.scrollTop=s.scrollHeight; }

function showThinking(){
  if(thinkingEl) return;
  hideEmpty(); thinkingT0=Date.now();
  var row=document.createElement('div'); row.className='thinking-row';
  row.innerHTML='<span class="thinking-dots"><i></i><i></i><i></i></span>'+
    '<span class="thinking-label">Ted is thinking · 0s</span>';
  $('msgs').appendChild(row); thinkingEl=row; scrollDown();
  thinkingTimer=setInterval(function(){
    if(!thinkingEl) return;
    var sec=Math.floor((Date.now()-thinkingT0)/1000);
    var lead=sec>=15?'Still working':sec>=7?'Working on it':'Ted is thinking';
    thinkingEl.querySelector('.thinking-label').textContent=lead+' · '+sec+'s';
    scrollDown();
  },1000);
}
function hideThinking(){
  if(thinkingTimer){ clearInterval(thinkingTimer); thinkingTimer=null; }
  if(thinkingEl){ thinkingEl.remove(); thinkingEl=null; }
  thinkingT0=0;
}

function copyText(text,btn){
  function done(){ if(!btn) return; var o=btn.textContent;
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(function(){ btn.textContent=o; btn.classList.remove('done'); },1500); }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,function(){ legacyCopy(text,done); });
  } else legacyCopy(text,done);
}
function legacyCopy(text,done){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.top='-1000px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); if(done) done(); }catch(e){}
  ta.remove();
}
/* ── what that reply cost ──────────────────────────────────────
   Wall-clock is measured here in the window, because only the window knows
   when he actually pressed Enter. Tokens and the brain come from the turn log
   a moment later — they are not known until the turn is written. */
var turnT0=0, lastBrain='';

function attachMeta(bubble, seconds){
  if(!bubble) return null;
  var m=document.createElement('div');
  m.className='meta';
  m.textContent=seconds.toFixed(1)+'s';
  if(bubble.parentNode) bubble.parentNode.appendChild(m);
  scrollDown();
  return m;
}

/* The turn row is written after the reply finishes streaming, so give the
   writer a beat rather than racing it. One retry, then give up quietly — a
   missing footnote is not worth an error in a chat window. */
function fillMeta(metaEl, tries){
  if(!metaEl) return;
  fetch('http://127.0.0.1:5175/api/diagnostics/turns?limit=1')
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var t=rows&&rows[0]; if(!t) throw 0;
      var who=t.provider==='groq'?'cloud':(t.provider||'—');
      var tok=t.total_tokens?(t.total_tokens.toLocaleString()
              +(t.tokens_estimated?'~':'')+' tok'):'';
      var bits=[metaEl.textContent];
      if(tok) bits.push(tok);
      bits.push(who);
      metaEl.innerHTML=bits.join('<span class="sep">·</span>')
        + (t.rate_limited?'<span class="sep">·</span>'
           +'<span class="warn">rate limited</span>':'');
      setBrain(t);
    })
    .catch(function(){ if(tries>0) setTimeout(function(){ fillMeta(metaEl,tries-1); },700); });
}

function setBrain(t){
  var d=$('brain'); if(!d) return;
  var cls = t.provider==='groq' ? 'cloud'
          : t.provider==='ollama' ? 'local'
          : t.provider==='reflex' ? 'reflex' : 'dead';
  d.className='dot '+cls;
  d.title = 'Answered by '+(cls==='cloud'?'the cloud model'
           : cls==='local'?'the local model'
           : cls==='reflex'?'a local shortcut (no model)':'nothing — the turn failed');
  /* Only animate the TRANSITION to local, and only when it was not chosen. */
  if(cls==='local' && lastBrain!=='local' && t.forced==='auto'){
    d.classList.add('fell');
    setTimeout(function(){ d.classList.remove('fell'); },3200);
    $('bud-txt').classList.add('warn');
  }
  if(cls==='cloud') $('bud-txt').classList.remove('warn');
  lastBrain=cls;
}

function refreshBudget(){
  fetch('http://127.0.0.1:5175/api/diagnostics/stats')
    .then(function(r){ return r.json(); })
    .then(function(s){
      var lim=s.tpm_limit||8000;
      var used=(s.tpm_limit_source==='provider'&&typeof s.tpm_remaining==='number')
        ? Math.max(0,lim-s.tpm_remaining) : (s.tpm||0);
      var pct=Math.min(100,Math.round(used/lim*100));
      var bar=$('bud-bar');
      bar.className=pct>=90?'bad':pct>=65?'warn':'';
      bar.firstElementChild.style.width=pct+'%';
      $('bud-txt').textContent=used.toLocaleString()+' / '+lim.toLocaleString();
      $('budget').title='Tokens used this minute: '+used.toLocaleString()+' of '
        +lim.toLocaleString()+(s.tpm_limit_source==='provider'
          ?' (reported by the provider)':' (assumed — provider did not report)');
    })
    .catch(function(){});
}

function addBubble(role,text){
  hideEmpty();
  var d=document.createElement('div');
  d.className='m '+(role==='user'?'user':'ted');
  var b=document.createElement('div'); b.className='b';
  if(role==='user') b.textContent=text; else b.innerHTML=mdlite(text);
  d.appendChild(b);
  $('msgs').appendChild(d); scrollDown();
  return b;
}

/* ── server plumbing (chat history) ───────────────────────── */
var serverWarned=false;
function apiFetch(path,opts){
  return fetch(API+path,opts).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status+' '+path);
    return r.json();
  });
}
function checkServer(){
  /* If something old is squatting on 5175, chats silently vanish — say so. */
  apiFetch('/version').then(function(v){
    if(!v.chats) throw new Error('old server');
  }).catch(function(){
    if(serverWarned) return; serverWarned=true;
    tedHud.showIssue('Chat history is NOT saving — an old dashboard is using '+
      'port 5175. Close it (or restart your Mac) and relaunch Ted.');
  });
}
function ensureChat(epoch){
  if(epoch!==chatEpoch) return Promise.reject(new Error('stale chat save'));
  if(currentChat!=null) return Promise.resolve(currentChat);
  if(!chatCreatePromise){
    chatCreatePromise=apiFetch('/chats',{method:'POST'}).then(function(j){
      if(j==null||j.id==null) throw new Error('chat create returned no id');
      if(epoch!==chatEpoch) throw new Error('stale chat create');
      currentChat=j.id; refreshChats();
      return currentChat;
    }).catch(function(e){
      chatCreatePromise=null;
      throw e;
    });
  }
  return chatCreatePromise;
}
function recordTurn(role,text){
  if(!text||!text.trim()) return;
  turnCount++;
  var epoch=chatEpoch, turn={role:role,content:text};
  chatSaveQueue=chatSaveQueue.then(function(){
    return ensureChat(epoch);
  }).then(function(id){
    if(epoch!==chatEpoch) return;
    return apiFetch('/chats/'+id+'/turns',{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(turn)});
  }).catch(function(e){
    if(String(e).indexOf('stale chat')!==-1) return;
    console.error('Ted chat save failed',e);
    tedHud.showIssue('Chat history failed to save this turn. The request still ran.');
  });
}
function maybeSummarize(){
  if(currentChat==null) return;
  if(!titled || turnCount%8===0){
    apiFetch('/chats/'+currentChat+'/summarize',{method:'POST'}).then(function(j){
      if(j&&j.title){ titled=true; $('chat-title').textContent=j.title; refreshChats(); }
    }).catch(function(){});
  }
}
function relTime(iso){
  var d=new Date(String(iso).replace(' ','T')); if(isNaN(d)) return '';
  var mins=(Date.now()-d.getTime())/60000;
  if(mins<1) return 'now';
  if(mins<60) return Math.floor(mins)+'m ago';
  if(mins<60*24) return Math.floor(mins/60)+'h ago';
  var days=Math.floor(mins/(60*24));
  if(days===1) return 'yesterday';
  if(days<7) return days+'d ago';
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}
function refreshChats(){
  apiFetch('/chats').then(function(list){
    if(!Array.isArray(list)){ checkServer(); return; }
    var host=$('chats'); host.innerHTML='';
    list.forEach(function(c){
      if(c.turns===0 && c.id!==currentChat) return;   // hide empty stubs
      var d=document.createElement('div');
      d.className='chatitem'+(c.id===currentChat?' active':'');
      d.innerHTML='<div class="ct">'+esc(c.title)+'</div>'+
                  '<div class="cm">'+relTime(c.updated)+'</div>';
      d.title=c.summary||c.title;
      d.onclick=function(){ openChat(c.id); };
      var del=document.createElement('button');
      del.className='del'; del.innerHTML='&times;';
      del.title='Remove from the sidebar. Ted keeps everything he learned here.';
      del.onclick=function(e){ e.stopPropagation(); hideChat(c.id); };
      d.appendChild(del);
      host.appendChild(d);
    });
  }).catch(function(){});
}
/* Deleting a chat takes it off the list and nothing else. The turns stay in the
   database and core/memory.py still searches this thread's title and summary,
   so asking Ted about something only said here still finds it. The toast says
   so, because a delete that quietly keeps the data would be worse than either
   honest option. */
function hideChat(id){
  apiFetch('/chats/'+id+'/hidden',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({hidden:true})})
    .then(function(){
      if(id===currentChat) newChat(); else refreshChats();
      tedHud.showIssue('Removed from the sidebar. Ted still remembers this conversation.');
    })
    .catch(function(){ tedHud.showIssue('Could not remove that chat.'); });
}
function openChat(id){
  apiFetch('/chats/'+id).then(function(c){
    chatEpoch++; chatCreatePromise=null; chatSaveQueue=Promise.resolve();
    currentChat=id; titled=(c.title!=='New chat'); turnCount=c.turns.length;
    streamEl=null; streamBuf='';
    $('chat-title').textContent=c.title;
    $('msgs').innerHTML='';
    if(!c.turns.length) $('msgs').innerHTML=
      '<div id="empty"><div class="big">What\'s on your mind?</div>Type below — or tap the mic to talk.</div>';
    c.turns.forEach(function(t){ addBubble(t.role,t.content); });
    refreshChats();
  }).catch(function(){});
}
function newChat(){
  chatEpoch++; chatCreatePromise=null; chatSaveQueue=Promise.resolve();
  currentChat=null; titled=false; turnCount=0;
  hideThinking();
  streamEl=null; streamBuf='';
  $('chat-title').textContent='New chat';
  $('msgs').innerHTML='<div id="empty"><div class="big">What\'s on your mind?</div>'+
                      'Type below — or tap the mic to talk.</div>';
  refreshChats();
}

/* ── side + apps panel state ──────────────────────────────── */
var appsUsed={};                 // app label → last time Ted touched it (ms)
var openApps=[];                 // live list of everything running on the Mac
var computerState={apps:[],details:{},frontmost:'',media:null};
var expandedApps={};
var USED_WINDOW=10*60*1000;      // "Ted is using it" badge lasts 10 minutes

function closeAppFromPanel(name){
  if(!inApp()) return;
  if(!confirm('Close '+name+'?')) return;
  window.pywebview.api.close_app_direct(name).then(function(){
    openApps=openApps.filter(function(a){ return a!==name; });  // optimistic
    renderApps();               // apps_watch confirms within ~5s
  });
}
function renderApps(){
  var host=$('apps-list');
  if(!openApps.length){
    host.innerHTML='<div id="apps-empty">No user-facing apps were detected.</div>';
    $('apps-summary').textContent='No apps detected'; return;
  }
  host.innerHTML='';
  var now=Date.now();
  var sorted=openApps.slice().sort(function(a,b){
    if(a===computerState.frontmost) return -1;
    if(b===computerState.frontmost) return 1;
    var ua=(appsUsed[a]&&now-appsUsed[a]<USED_WINDOW)?1:0;
    var ub=(appsUsed[b]&&now-appsUsed[b]<USED_WINDOW)?1:0;
    if(ua!==ub) return ub-ua;                 // Ted's apps float to the top
    return a.localeCompare(b);
  });
  var details=computerState.details||{};
  var tabCount=0,terminalCount=0;
  Object.keys(details).forEach(function(k){
    tabCount+=(details[k].tabs||[]).length;
    terminalCount+=(details[k].terminals||[]).length;
  });
  $('apps-summary').textContent=openApps.length+' apps · '+tabCount+' browser tabs'+
    (terminalCount?' · '+terminalCount+' terminals':'');
  sorted.forEach(function(name){
    var used=appsUsed[name]&&now-appsUsed[name]<USED_WINDOW;
    var front=name===computerState.frontmost;
    var info=details[name]||{kind:'app',windows:[]};
    var tabs=info.tabs||[],terms=info.terminals||[],windows=info.windows||[];
    var countLabel=tabs.length?(tabs.length+' tab'+(tabs.length===1?'':'s')):
      terms.length?(terms.length+' terminal'+(terms.length===1?'':'s')):
      windows.length?(windows.length+' window'+(windows.length===1?'':'s')):'';
    if(expandedApps[name]===undefined)
      expandedApps[name]=front||tabs.length>0||terms.length>0;
    var d=document.createElement('div');
    d.className='appitem'+(used?' used':'')+(front?' front':'')+
      (expandedApps[name]?' expanded':'');
    var h=document.createElement('div'); h.className='apphead';
    h.innerHTML='<span class="dot"></span><span class="nm">'+esc(name)+'</span>'+
      (front?'<span class="tag">FRONT</span>':used?'<span class="tag">TED</span>':'')+
      (countLabel?'<span class="meta">'+esc(countLabel)+'</span>':'')+
      '<span class="x" title="Close '+esc(name)+'">×</span>';
    h.onclick=function(){ expandedApps[name]=!expandedApps[name]; renderApps(); };
    h.querySelector('.x').onclick=function(e){ e.stopPropagation(); closeAppFromPanel(name); };
    d.appendChild(h);
    var children=document.createElement('div'); children.className='appchildren';
    tabs.forEach(function(tab){
      var row=document.createElement('div'); row.className='subitem'+(tab.active?' active':'');
      row.title=tab.url||tab.title||'';
      row.innerHTML='<div class="subtop"><span class="mark">'+(tab.active?'●':'○')+'</span>'+
        '<span class="st">'+esc(tab.title||'Untitled tab')+'</span></div>'+
        '<div class="ss">'+esc((tab.host||'local')+' · window '+(tab.window||1))+'</div>';
      children.appendChild(row);
    });
    terms.forEach(function(term){
      var row=document.createElement('div'); row.className='subitem'; row.title=term.cwd||'';
      row.innerHTML='<div class="subtop"><span class="mark">›_</span><span class="st">'+
        esc(term.folder||term.tty||term.shell||'Terminal')+'</span>'+
        (term.branch?'<span class="branch">'+esc(term.branch)+'</span>':'')+'</div>'+
        '<div class="ss">'+esc((term.shell||'shell')+' · '+(term.tty||''))+'</div>';
      children.appendChild(row);
    });
    if(!tabs.length&&!terms.length) windows.slice(0,8).forEach(function(win){
      var row=document.createElement('div'); row.className='subitem'; row.title=win.title||'';
      row.innerHTML='<div class="subtop"><span class="mark">□</span><span class="st">'+
        esc(win.title||name+' window')+'</span></div>';
      children.appendChild(row);
    });
    if((computerState.media||{}).source&&name.indexOf('Spotify')>=0){
      var media=computerState.media,row=document.createElement('div'); row.className='subitem active';
      row.innerHTML='<div class="subtop"><span class="mark">♪</span><span class="st">'+
        esc(media.title||'Playing')+'</span></div><div class="ss">'+esc(media.artist||media.device||'')+'</div>';
      children.insertBefore(row,children.firstChild);
    }
    if(children.childNodes.length) d.appendChild(children);
    host.appendChild(d);
  });
}
/* One collapse component, instantiated twice — chat panel on the left, computer
   panel on the right, mirrored. The controls used to live in the header, which
   put the button for a panel nowhere near the panel; each now has a rail on its
   own inner edge, and that same rail is what stays behind to reopen it. */
function makeCollapsible(panelId, railId, opts){
  var panel=$(panelId), rail=$(railId);
  function apply(collapsed, persist){
    panel.classList.toggle('collapsed', collapsed);
    /* Chevron points the way the panel will move, so the rail says what it
       does rather than what it is. */
    rail.innerHTML=collapsed?opts.openGlyph:opts.closeGlyph;
    rail.title=collapsed?opts.openTitle:opts.closeTitle;
    if(persist){ try{ localStorage.setItem(opts.key, collapsed?'closed':'open'); }catch(e){} }
    if(opts.onChange) opts.onChange(collapsed);
  }
  rail.onclick=function(){ apply(!panel.classList.contains('collapsed'), true); };
  var saved=null;
  try{ saved=localStorage.getItem(opts.key); }catch(e){}
  apply(saved===null ? !!opts.startCollapsed : saved==='closed', false);
  return {
    toggle:function(){ apply(!panel.classList.contains('collapsed'), true); },
    isOpen:function(){ return !panel.classList.contains('collapsed'); }
  };
}

/* Header crowding, measured rather than guessed. Watching #top covers both
   causes at once — the window being resized and the apps panel opening — so
   there is one rule instead of two that can disagree. */
function fitHeader(){
  var top=$('top'); if(!top) return;
  var w=top.clientWidth;
  top.classList.toggle('tight', w<620);

/* ── tedHud: the full API Python calls ────────────────────── */
var toastT=null, heardT=null;
var tedHud={
  setState:function(s){
    if(s==='error'||s==='offline'){ hideThinking(); return; }
    if(!(s in STATE_TEXT)) return;
    var st=$('status');
    if(s==='thinking') showThinking(); else hideThinking();
    if(s==='idle'){ st.className=''; st.querySelector('#status-t').textContent=''; }
    else{ st.className=s+' active'; st.querySelector('#status-t').textContent=STATE_TEXT[s]; }
  },
  addMessage:function(role,text){
    if(role==='ted') hideThinking();
    if(role==='ted'){
      if(streamEl){ return; }                    // streamed reply still rendering
      // app.py calls add_message with the full reply AFTER streaming it —
      // the streamed bubble is already on screen and recorded, so drop the
      // repeat. (Voice mode strips openers from the streamed copy, hence
      // the contains-check rather than strict equality.)
      if(lastStreamText!==null){
        var a=_norm(text), b=_norm(lastStreamText);
        if(a===b || a.indexOf(b)!==-1 || b.indexOf(a)!==-1){ lastStreamText=null; return; }
        lastStreamText=null;
      }
    }
    var el=addBubble(role,text);
    recordTurn(role,text);
    if(role==='ted'){
      maybeSummarize();
      /* The reflex lane and the deterministic commands never stream, so they
         reach here instead of endTedReply. They are the fastest turns Ted has
         and deserve to be seen as such. */
      if(turnT0){
        fillMeta(attachMeta(el,(Date.now()-turnT0)/1000), 4);
        turnT0=0;
      }
      refreshBudget();
    }
  },
  streamTedText:function(piece){
    hideThinking();
    if(!streamEl){ streamEl=addBubble('ted',''); streamBuf=''; }
    streamBuf+=piece;
    streamEl.innerHTML=mdlite(streamBuf);
    scrollDown();
  },
  endTedReply:function(){
    if(streamEl){
      var text=streamBuf;
      streamEl.innerHTML=mdlite(text);   // final render (closes any open code fence)
      var done=streamEl;
      streamEl=null; streamBuf='';
      lastStreamText=text;
      recordTurn('ted',text);
      maybeSummarize();
      if(turnT0){
        fillMeta(attachMeta(done,(Date.now()-turnT0)/1000), 4);
        turnT0=0;
      }
      refreshBudget();
    }
  },
  showIssue:function(text){
    var t=$('toast');
    t.classList.remove('memory'); t.onclick=null;
    $('toast-b').textContent=text; t.classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },6000);
  },
  clearIssue:function(){ $('toast').classList.remove('show'); },

  /* Ted's memory changed. Pushed from core/memory.py's single emitter, so this
     fires for every path that writes — explicit "remember that…", background
     fact extraction, and the end-of-session summary alike.
     Clicking it opens the memory panel on that exact row, because being told
     Ted learned something is only half useful if correcting it means going and
     finding it. */
  memoryEvent:function(ev){
    if(!ev||!ev.text) return;
    var removed=ev.kind==='removed';
    var t=$('toast');
    $('toast-b').innerHTML='<span class="mlabel">'+
      (removed?'Memory removed':'Memory updated')+'</span>'+esc(ev.text)+
      '<span class="mhint">click to edit</span>';
    t.classList.add('show','memory');
    t.onclick=function(){
      t.classList.remove('show');
      tedHud.showMemory({table:ev.table||'facts', id:ev.id});
    };
    clearTimeout(toastT);
    /* Longer than a problem toast: this one is a control, and six seconds is
       not long enough to read it and decide to click it. */
    toastT=setTimeout(function(){
      t.classList.remove('show','memory'); t.onclick=null;
    },9000);
  },
  setMuted:function(m){
    muted=!!m;
    $('mic').classList.toggle('on',!muted);
    $('mic').title=muted?'Voice mode off — click to talk':'Voice mode ON — click to mute';
    if(muted) tedHud.setState('idle');
  },
  // Transcribe mode is mic-on/speakers-off, so it is neither of the two states
  // setMuted knows about and needs its own indicator.
  setTranscribing:function(t){
    transcribing=!!t;
    $('transcribe').classList.toggle('on',transcribing);
    $('transcribe').title=transcribing
      ? 'Dictating — click to stop. Ted stays silent.'
      : "Dictate into the box — Ted won't speak";
    if(transcribing) tedHud.setState('listening');
  },
  // A transcript is a draft, not a message: it lands in the box so it can be
  // edited, and is never sent on Charlie's behalf.
  fillInput:function(text){
    var box=$('input');
    var cur=box.value.trim();
    box.value=(cur?cur+' ':'')+text;
    box.style.height='auto'; box.style.height=Math.min(box.scrollHeight,150)+'px';
    box.focus();
    box.selectionStart=box.selectionEnd=box.value.length;
  },
  flashHeard:function(text,final){
    var e=$('heard'); e.textContent=(final?'':'… ')+text; e.classList.add('show');
    clearTimeout(heardT); heardT=setTimeout(function(){ e.classList.remove('show'); },final?2500:4000);
  },

  /* timers / alarms — chips under the header */
  addTimer:function(rid,endMs,label){
    var host=$('chips');
    var c=document.createElement('span'); c.className='chip'; c.id='timer-'+rid;
    var lbl=document.createElement('span'); lbl.textContent=label||'timer';
    var t=document.createElement('span');
    var x=document.createElement('span'); x.className='x'; x.textContent='×';
    x.onclick=function(){ if(inApp()) window.pywebview.api.cancel_timer(rid); c.remove(); };
    c.appendChild(lbl); c.appendChild(t); c.appendChild(x); host.appendChild(c);
    (function tick(){
      var left=Math.max(0,Math.round((endMs-Date.now())/1000));
      var m=Math.floor(left/60), s=left%60;
      t.textContent=m+':'+(s<10?'0':'')+s;
      if(left>0&&document.getElementById('timer-'+rid)) setTimeout(tick,1000);
    })();
  },
  clearTimer:function(){ $('chips').querySelectorAll('.chip').forEach(function(c){
    if(c.id.indexOf('timer-')===0) c.remove(); }); },
  clearTimerById:function(rid){ var c=document.getElementById('timer-'+rid); if(c) c.remove(); },
  flashAlarm:function(){
    document.querySelectorAll('#chips .chip').forEach(function(c){ c.classList.add('alarm'); });
    setTimeout(function(){ document.querySelectorAll('#chips .chip').forEach(function(c){
      c.classList.remove('alarm'); }); },4000);
  },

  /* reminders dropdown */
  showReminders:function(items){
    var host=$('remlist'); host.innerHTML='';
    (items||[]).forEach(function(r){
      var d=document.createElement('div');
      d.textContent=(typeof r==='string')?r:(r.text||r.label||JSON.stringify(r));
      host.appendChild(d);
    });
    $('rempanel').classList.add('open');
  },
  hideReminders:function(){ $('rempanel').classList.remove('open'); },

  /* health dots + voice label removed from the UI — keep the API alive */
  setHealth:function(){}, setVoice:function(){},

  /* now playing — pill at the top left. Music playing = Ted using Spotify,
     which also covers the intent path that skips _dispatch_tool. */
  setNowPlaying:function(np){
    var text=(typeof np==='string')?np:((np&&np.text)||'');
    $('np-text').textContent=text;
    $('np-stack').classList.toggle('show',!!text);
    if(text){ appsUsed['Spotify']=Date.now(); renderApps(); }
  },

  /* live open-apps feed from apps_watch (every ~5s, on change) */
  setOpenApps:function(apps){
    if(Array.isArray(apps)){ openApps=apps; renderApps(); }
  },

  /* full live hierarchy: apps → windows/tabs/terminal sessions */
  setComputerState:function(state){
    if(!state||!Array.isArray(state.apps)) return;
    computerState=state; openApps=state.apps; renderApps();
  },

  /* Ted touched a tool — mark the matching app as in use */
  noteAppUse:function(tool){
    var map={play_music:'Spotify',play_playlist:'Spotify',spotify_control:'Spotify',
      calendar_get:'Calendar',calendar_add:'Calendar',
      get_emails:'Mail',read_email:'Mail',email_action:'Mail',send_email:'Mail',
      send_message:'Messages',notes_add:'Notes',notes_get:'Notes',
      set_reminder:'Reminders',get_reminders:'Reminders',
      get_weather:'Weather',search_knowledge:'Knowledge',add_knowledge:'Knowledge',
      screen_describe:'Screen'};
    var label=map[tool]; if(!label) return;
    appsUsed[label]=Date.now();
    renderApps();
    if(appsPanel && !appsPanel.isOpen()) $('apps-rail').classList.add('noted');
  },

  /* memory overlay.
     `focus` ({table,id}) asks the dashboard to open that table and scroll the
     row into view — passed as a hash so reopening the same panel on a
     different row still navigates (the iframe would ignore an identical src). */
  showMemory:function(focus){
    var f=$('memframe');
    var base='http://127.0.0.1:5175';
    if(focus&&focus.table&&focus.id!=null){
      f.src=base+'/#'+encodeURIComponent(focus.table)+'/'+encodeURIComponent(focus.id);
    } else if(!f.src){
      f.src=base;
    }
    $('mempanel').classList.add('open');
  },
  hideMemory:function(){ $('mempanel').classList.remove('open'); },
  toggleMemory:function(){
    if($('mempanel').classList.contains('open')) tedHud.hideMemory();
    else { tedHud.hideDiagnostics(); tedHud.showMemory(); }
  },

  /* diagnostics overlay */
  showDiagnostics:function(){
    var f=$('diagframe');
    /* Reload on every open rather than only on first open: unlike the memory
       tables, this page is about what just happened, and a stale one is
       actively misleading. It self-refreshes every 2s once loaded. */
    f.src='http://127.0.0.1:5175/diagnostics?t='+Date.now();
    $('diagpanel').classList.add('open');
  },
  hideDiagnostics:function(){
    $('diagpanel').classList.remove('open');
    /* Drop the frame so its 2-second polling loop stops while hidden. */
    var f=$('diagframe'); if(f) f.src='about:blank';
  },
  toggleDiagnostics:function(){
    if($('diagpanel').classList.contains('open')) tedHud.hideDiagnostics();
    else { tedHud.hideMemory(); tedHud.showDiagnostics(); }
  },

  /* compat stubs — Python still calls these; nothing to show in chat mode */
  pushAmplitude:function(){}, clearAmplitude:function(){},
  setAttention:function(){}, micIdle:function(){},
  setMode:function(){}, setVoiceMode:function(){}, toggleMode:function(){},
  setConversations:function(){}, setWeather:function(){},
  showChat:function(){}, hideChat:function(){}, toggleChat:function(){},
};
window.tedHud=tedHud;

/* ── controls ─────────────────────────────────────────────── */
function sendMsg(){
  var input=$('input');
  var txt=input.value.trim(); if(!txt) return;
  input.value=''; input.style.height='auto';
  /* Timed from the keypress, not from when the request was accepted — the
     second number flatters itself by excluding retrieval, retries and the
     entire local-brain attempt, which is exactly where the waiting was. */
  turnT0=Date.now();
  addBubble('user',txt);
  recordTurn('user',txt);
  tedHud.setState('thinking');
  if(inApp()) window.pywebview.api.ask(txt);
}
$('send').onclick=sendMsg;
$('input').addEventListener('keydown',function(e){
  e.stopPropagation();
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMsg(); }
});
$('input').addEventListener('input',function(){
  this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,150)+'px';
});
$('mic').onclick=function(){
  // Python pushes both indicators through setMuted/setTranscribing, so the
  // in-app path deliberately does not set them from the return value too —
  // two writers for one piece of state is how they drift apart.
  if(inApp()) window.pywebview.api.toggle_mute();
  else { tedHud.setMuted(!muted); tedHud.setTranscribing(false); }
};
$('transcribe').onclick=function(){
  if(inApp()) window.pywebview.api.toggle_transcribe();
  else { tedHud.setTranscribing(!transcribing); tedHud.setMuted(true); }
};

/* ── Spotify transport ────────────────────────────────────────────────────
   Charlie asked for a skip BUTTON, not only a spoken command. These go
   straight to Python and never near the model: no token, no rate limit, and
   no chance of Ted reporting a skip that did not happen. */
var npPlaying=false;
function renderNowPlaying(s){
  if(!s||!s.title){ $('nowplaying').classList.remove('show'); return; }
  npPlaying=!!s.playing;
  $('nowplaying').classList.add('show');
  $('tplay').innerHTML=npPlaying?'&#10073;&#10073;':'&#9654;';
  $('tplay').title=npPlaying?'Pause':'Play';
  var label=s.artist?(s.title+' — '+s.artist):s.title;
  $('nptext').textContent=label;
  /* The header pill is written by Python when Ted touches Spotify; this poll
     is the only thing that notices a skip. Keep the two showing the same track
     rather than letting the pill go stale and contradict the strip. */
  if($('np-stack').classList.contains('show')) $('np-text').textContent=label;
}
function pollNowPlaying(){
  if(!inApp()) return;
  window.pywebview.api.music_now_playing().then(renderNowPlaying).catch(function(){});
}
function transport(action){
  if(!inApp()) return;
  window.pywebview.api.music_transport(action).then(function(r){
    if(r&&r.now) renderNowPlaying(r.now);
    // Spotify reports the previous track for a moment after a skip.
    setTimeout(pollNowPlaying,700);
  }).catch(function(){});
}
$('tprev').onclick=function(){ transport('previous'); };
$('tnext').onclick=function(){ transport('next'); };
$('np-skip').onclick=function(){ transport('next'); };   // same path, top of the window
$('tplay').onclick=function(){ transport(npPlaying?'pause':'play'); };
$('newchat').onclick=newChat;
$('membtn').onclick=function(){ tedHud.toggleMemory(); };
$('diagbtn').onclick=function(){ tedHud.toggleDiagnostics(); };
sidePanel=makeCollapsible('side','side-rail',{
  key:'ted_side', startCollapsed:false,
  openGlyph:'›', closeGlyph:'‹',
  openTitle:'Show chats', closeTitle:'Hide chats'});
appsPanel=makeCollapsible('apps','apps-rail',{
  key:'ted_apps', startCollapsed:true,
  openGlyph:'‹', closeGlyph:'›',
  openTitle:'Show what is open on your Mac', closeTitle:'Hide the computer panel',
  onChange:function(collapsed){
    if(!collapsed){ $('apps-rail').classList.remove('noted'); renderApps(); }
  }});

/* ── copying selected text ────────────────────────────────────
   pywebview's macOS WKWebView has no Edit menu, so the system Cmd+C and the
   native right-click "Copy" never reach the page — the context menu falls
   back to Services only. Both are wired manually here. */
function selectedText(){
  var s=window.getSelection();
  return s?String(s).trim():'';
}
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&(e.key==='c'||e.key==='C')){
    var t=selectedText();
    if(t){ copyText(t); e.preventDefault(); }
  }
},true);
document.addEventListener('contextmenu',function(e){
  var t=selectedText();
  if(!t) return;                 // no selection → leave the native menu alone
  e.preventDefault();
  var m=$('ctxmenu');
  m.classList.add('open');
  var mw=140, mh=36;
  m.style.left=Math.min(e.clientX,window.innerWidth-mw)+'px';
  m.style.top=Math.min(e.clientY,window.innerHeight-mh)+'px';
});
$('ctx-copy').onclick=function(){
  copyText(selectedText());
  $('ctxmenu').classList.remove('open');
};
document.addEventListener('mousedown',function(e){
  if(!$('ctxmenu').contains(e.target)) $('ctxmenu').classList.remove('open');
});
setInterval(function(){ if(appsPanel && appsPanel.isOpen()) renderApps(); },60000);
/* The minute window slides whether or not he is typing, so the bar has to move
   on its own. 10s is often enough to watch it recover after a rate limit and
   cheap enough to ignore. */
setInterval(refreshBudget, 10000);
refreshBudget();
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('mempanel').classList.contains('open')) tedHud.hideMemory();
  if(e.key==='Escape'&&$('diagpanel').classList.contains('open')) tedHud.hideDiagnostics();
});

/* ── boot ─────────────────────────────────────────────────── */
(function(){
  tedHud.setMuted(true);          // Ted starts silent; mic button turns voice on
  var st=$('status');
  if(inApp()){ st.className='active'; $('status-t').textContent='STARTING'; }
  else{ st.className='active'; $('status-t').textContent='DEMO'; }
  window.addEventListener('pywebviewready',function(){
    st.className=''; $('status-t').textContent='';   // quiet until he's busy
    // Poll slowly and only while the window is visible. This is a local
    // Python call, but it reaches Spotify's API, and hammering that for a
    // one-line strip would be a poor trade.
    pollNowPlaying();
    setInterval(function(){
      if(!document.hidden) pollNowPlaying();
    },10000);
  });
  /* the chat server (port 5175) boots in a thread — retry until it's up */
  var tries=0;
  (function ping(){
    apiFetch('/version').then(function(v){
      if(!v.chats){ checkServer(); return; }
      refreshChats();
    }).catch(function(e){
      if(String(e).indexOf('HTTP')!==-1){ checkServer(); return; }  // old server: up but no /version
      if(++tries<20) setTimeout(ping,1000);
      else checkServer();
    });
  })();
  setInterval(refreshChats,60000);   // keep sidebar timestamps fresh
  tickClock(); fitHeader();
  setTimeout(fetchWeather,2500);     // give the local server a moment first
  $('input').focus();
})();
</script>
