<!doctype html>
<html><head><meta charset="utf-8"><title>Ted Pet</title>
<style>
:root{--ink:#342417;--paper:#fffdf8;--glass:rgba(248,248,252,.68);--glass-edge:rgba(255,255,255,.84);--blue:#0a84ff;--cyan:#66dbea}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-user-select:none;user-select:none}button,textarea{font:500 12px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
#stage{position:relative;width:292px;height:100%;min-height:238px;overflow:hidden}
/* Smooth comic-book dialogue, deliberately separate from the pixel character. */
#bubble{position:absolute;z-index:14;right:8px;top:9px;width:126px;max-height:106px;padding:10px 12px;color:#18130f;background:rgba(255,253,248,.97);border:2px solid var(--ink);border-radius:48% 45% 43% 47% / 42% 46% 44% 48%;box-shadow:0 7px 20px rgba(48,30,15,.16),inset 0 1px 0 #fff;opacity:0;visibility:hidden;transform:translateY(-5px) scale(.96);transform-origin:bottom left;transition:opacity .16s,transform .16s,visibility 0s .16s;-webkit-app-region:no-drag}
#bubble.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}#bubble:before{content:"";position:absolute;left:-17px;bottom:13px;width:22px;height:17px;background:var(--paper);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);border-radius:0 0 0 100%;transform:rotate(19deg);clip-path:polygon(0 35%,100% 0,100% 100%,0 100%)}#bubble .text{max-height:82px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.28;text-align:center;-webkit-user-select:text;user-select:text}
/* One source painting, split and scaled into a big head and little body. */
#character{position:absolute;z-index:4;left:10px;top:29px;width:146px;height:133px;transform-origin:50% 100%;cursor:grab}#character:active{cursor:grabbing}.bear-piece{position:absolute;pointer-events:none;image-rendering:pixelated;filter:drop-shadow(3px 5px 0 rgba(40,20,5,.16));-webkit-user-drag:none}#body-piece{z-index:1;left:34px;top:30px;width:80px;height:auto;clip-path:inset(43% 0 0 0)}#head-piece{z-index:2;left:5px;top:0;width:136px;height:auto;clip-path:inset(0 0 48% 0)}
/* Expression overlays stay blocky so Ted himself remains pixel-art. */
#face{position:absolute;z-index:5;left:0;top:0;width:146px;height:72px;pointer-events:none}.lid,.brow,.mouth{position:absolute;opacity:0;background:#5a2e0e;border-radius:8px}.lid{top:36px;width:12px;height:4px}.lid.left{left:49px}.lid.right{right:47px}.brow{top:28px;width:15px;height:3px}.brow.left{left:47px}.brow.right{right:45px}.mouth{left:67px;top:57px;width:13px;height:4px;background:#3d210e}#stage.bored .lid{opacity:1;transform:rotate(7deg)}#stage.bored .lid.right{transform:rotate(-7deg)}#stage.bored .mouth{opacity:1;border-radius:8px 8px 2px 2px}#stage.error .brow{opacity:1;transform:rotate(17deg)}#stage.error .brow.right{transform:rotate(-17deg)}#stage.error .mouth{opacity:1;height:6px;border-radius:50% 50% 0 0}
#glasses{position:absolute;z-index:7;left:43px;top:28px;width:60px;height:24px;opacity:0;pointer-events:none;transform:scale(.25) rotate(-12deg)}#glasses:before,#glasses:after{content:"";position:absolute;top:0;width:21px;height:17px;border:4px solid #24211e;border-radius:47%;background:rgba(200,237,255,.22)}#glasses:before{left:0}#glasses:after{right:0}#glasses i{position:absolute;left:25px;top:7px;width:10px;height:4px;background:#24211e}#stage.thinking #glasses{animation:glasses-poof 6s cubic-bezier(.2,1.5,.35,1) infinite}@keyframes glasses-poof{0%,4%,48%,100%{opacity:0;transform:scale(.25) rotate(-12deg)}8%,42%{opacity:1;transform:scale(1)}}
#poof{position:absolute;z-index:8;left:126px;top:55px;width:34px;height:30px;opacity:0;border:2px solid var(--ink);background:#fff;border-radius:50%;pointer-events:none}#poof:before,#poof:after{content:"";position:absolute;background:#fff;border:2px solid var(--ink);border-radius:50%}#poof:before{width:17px;height:17px;left:-8px;top:8px}#poof:after{width:20px;height:20px;right:-9px;top:5px}
#chalkboard{position:absolute;z-index:9;left:136px;top:61px;width:137px;height:75px;padding:8px 7px;color:#fff9dc;background:linear-gradient(145deg,#315e54,#183e37);border:5px solid #9a6030;border-radius:5px;box-shadow:0 5px 13px rgba(27,20,13,.22);opacity:0;transform:scale(.2) rotate(9deg);transform-origin:left center;pointer-events:none;font:700 11px/1.3 "Comic Sans MS","Chalkboard SE",cursive}#chalkboard:after{content:"";position:absolute;left:12px;right:12px;bottom:-8px;height:5px;background:#8c562d;border-radius:3px}#chalkboard .sum{font-size:16px;color:#ffe58a}#chalkboard .line{display:block;width:76px;margin-top:5px;border-top:2px solid rgba(255,255,255,.76)}#stage.thinking #poof{animation:poof 6s ease-out infinite}#stage.thinking #chalkboard{animation:board-poof 6s cubic-bezier(.2,1.5,.35,1) infinite}@keyframes poof{0%,47%,51%,56%,100%{opacity:0;transform:scale(.35)}49%,53%{opacity:.95;transform:scale(1.2)}}@keyframes board-poof{0%,51%,98%,100%{opacity:0;transform:scale(.2) rotate(9deg)}57%,92%{opacity:1;transform:scale(1) rotate(-1deg)}}
#work-prop{position:absolute;z-index:10;left:132px;top:66px;width:132px;height:64px;opacity:0;pointer-events:none;transform:translateY(8px) scale(.88)}#work-prop .sheet{position:absolute;left:18px;top:0;width:75px;height:55px;padding:10px 8px;background:#fff;border:2px solid var(--ink);border-radius:4px;box-shadow:3px 4px 0 rgba(52,36,23,.18)}#work-prop .sheet i{display:block;height:3px;margin:0 0 6px;background:#92b8cd;border-radius:3px}#work-prop .pencil{position:absolute;left:82px;top:8px;width:8px;height:48px;background:#ffd34d;border:2px solid var(--ink);transform:rotate(33deg);transform-origin:bottom center}#stage.working #work-prop{opacity:1;transform:none;transition:.2s;animation:paper-bob 1.6s ease-in-out infinite}#stage.working #work-prop .pencil{animation:scribble .42s ease-in-out infinite alternate}#stage.working #glasses,#stage.working #chalkboard,#stage.working #poof{display:none}@keyframes paper-bob{50%{transform:translateY(-2px)}}@keyframes scribble{to{transform:translate(5px,2px) rotate(26deg)}}
#sleep{position:absolute;z-index:8;left:120px;top:25px;color:#4f3f72;font:800 14px/1 Georgia,serif;opacity:0;pointer-events:none;text-shadow:0 1px 0 #fff}#stage.bored #sleep{animation:zzz 2.4s ease-out infinite}@keyframes zzz{0%{opacity:0;transform:translate(0,10px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(17px,-19px) scale(1.25)}}
#stage.idle #character{animation:idle 3.2s steps(4,end) infinite}#stage.thinking #character{animation:think .9s steps(4,end) infinite}#stage.working #character{animation:work .62s steps(2,end) infinite}#stage.speaking #character{animation:talk .48s steps(2,end) infinite}#stage.listening #character{animation:listen 1.25s steps(3,end) infinite;filter:drop-shadow(0 0 7px var(--cyan))}#stage.bored #character{animation:doze 3.6s ease-in-out infinite}@keyframes idle{50%{transform:translateY(-1px) scaleY(1.012)}}@keyframes think{50%{transform:translateY(-3px) rotate(-1.5deg)}}@keyframes work{50%{transform:translateY(-2px) rotate(.7deg)}}@keyframes talk{50%{transform:translateY(-3px) scaleY(1.02)}}@keyframes listen{50%{transform:scale(1.025)}}@keyframes doze{50%{transform:translateY(3px) rotate(-2deg)}}
#hover-zone{position:absolute;z-index:3;left:7px;top:20px;width:152px;height:158px}#controls{position:absolute;z-index:18;left:74px;top:145px;display:flex;gap:7px;padding:6px;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(5px);border:1px solid var(--glass-edge);border-radius:22px;background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.92),0 7px 22px rgba(28,31,38,.19);backdrop-filter:blur(18px) saturate(165%);-webkit-backdrop-filter:blur(18px) saturate(165%);transition:opacity .16s,transform .16s;-webkit-app-region:no-drag}#stage.near #controls,#character:hover~#controls,#hover-zone:hover~#controls,#controls:hover,#controls:focus-within,#composer.open~#controls{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.mode{display:grid;place-items:center;width:31px;height:31px;padding:0;border:1px solid rgba(255,255,255,.85);border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(225,229,237,.56));color:#32353a;cursor:pointer;box-shadow:inset 0 1px 1px #fff,0 3px 8px rgba(20,25,35,.16);transition:transform .14s,background .14s,box-shadow .14s}.mode:hover{transform:scale(1.08);background:rgba(255,255,255,.96)}.mode:active{transform:scale(.94)}.mode.on{color:#fff;background:linear-gradient(145deg,#49a7ff,#0878e8);box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 3px 10px rgba(10,132,255,.32)}.mode svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
/* Compact Messages-style composer; extra rows grow the native window downward. */
#composer{position:absolute;z-index:20;left:9px;right:9px;top:204px;display:none;align-items:flex-end;min-height:39px;gap:5px;padding:4px 4px 4px 12px;background:rgba(241,242,246,.82);border:1px solid rgba(255,255,255,.9);border-radius:21px;box-shadow:inset 0 1px 1px rgba(255,255,255,.95),0 6px 18px rgba(30,34,42,.17);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);-webkit-app-region:no-drag}#composer.open{display:flex}#pet-input{flex:1;height:29px;min-height:29px;max-height:83px;resize:none;overflow-y:hidden;border:0;background:transparent;color:#17191d;padding:7px 1px 5px;outline:none;-webkit-user-select:text;user-select:text;font-weight:400}#pet-input::placeholder{color:#81858c}#pet-input.scroll{overflow-y:auto}#send{display:grid;place-items:center;flex:0 0 auto;width:30px;height:30px;border:0;border-radius:50%;background:linear-gradient(145deg,#43a3ff,#0878e8);color:#fff;cursor:pointer;padding:0;box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 2px 7px rgba(10,132,255,.3)}#send:active{transform:scale(.92)}#send svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4}
#close-x{position:absolute;z-index:24;display:none;left:15px;top:25px;width:26px;height:26px;padding:0;border:1px solid rgba(255,255,255,.88);border-radius:50%;background:rgba(241,242,246,.76);color:#34363b;font:400 18px/24px -apple-system,sans-serif;cursor:pointer;box-shadow:inset 0 1px 1px #fff,0 4px 12px rgba(25,28,34,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);-webkit-app-region:no-drag}#close-x.show{display:block;animation:pop .16s ease-out}#close-x:hover{background:rgba(255,99,92,.88);color:#fff}@keyframes pop{from{opacity:0;transform:scale(.55)}}@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style></head>
<body><main id="stage" class="idle">
<section id="bubble" aria-live="polite"><div class="text"></div></section>
<div id="character" role="button" aria-label="Ted. Double-click to open chat." tabindex="0"><img class="bear-piece" id="body-piece" src="ted_pet.png" alt="" draggable="false"><img class="bear-piece" id="head-piece" src="ted_pet.png" alt="" draggable="false"><div id="face" aria-hidden="true"><i class="lid left"></i><i class="lid right"></i><i class="brow left"></i><i class="brow right"></i><i class="mouth"></i></div><div id="glasses" aria-hidden="true"><i></i></div></div>
<div id="sleep" aria-hidden="true">Z z z</div><div id="poof" aria-hidden="true"></div><div id="chalkboard" aria-hidden="true"><span class="sum">2 + 2 = 4</span><span class="line"></span><span>hmm...</span></div><div id="work-prop" aria-hidden="true"><span class="sheet"><i></i><i></i><i></i></span><span class="pencil"></span></div>
<form id="composer"><textarea id="pet-input" rows="1" placeholder="Message Ted" aria-label="Message Ted"></textarea><button id="send" type="submit" title="Send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 18V6M7 11l5-5 5 5"/></svg></button></form><div id="hover-zone" aria-hidden="true"></div>
<nav id="controls" aria-label="Ted pet controls"><button class="mode" id="voice" type="button" title="Voice mode" aria-label="Voice mode"><svg viewBox="0 0 24 24"><path d="M4 7h8M4 12h14M4 17h11"/></svg></button><button class="mode" id="transcribe" type="button" title="Silent transcription" aria-label="Silent transcription"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3M8 22h8"/></svg></button><button class="mode" id="text" type="button" title="Type to Ted" aria-label="Type to Ted"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM7 10h10M7 14h7"/></svg></button></nav><button id="close-x" type="button" title="Close pet" aria-label="Close pet">&times;</button>
</main><script>
function api(){return window.pywebview&&window.pywebview.api?window.pywebview.api:null}function $(id){return document.getElementById(id)}
var mode='off',state='idle',bored=false,engaged=false,bubbleTimer=null,boredTimer=null,workTimer=null;
function paintState(){['idle','thinking','working','speaking','listening','error'].forEach(function(s){$('stage').classList.remove(s)});$('stage').classList.add(state);$('stage').classList.toggle('bored',bored)}
function scheduleBored(){clearTimeout(boredTimer);bored=false;paintState();if(state!=='idle')return;boredTimer=setTimeout(function(){if(state!=='idle')return;bored=true;paintState();boredTimer=setTimeout(function(){bored=false;paintState();scheduleBored()},9000)},28000+Math.random()*17000)}
function resizeInput(){var input=$('pet-input');input.style.height='29px';var height=Math.max(29,Math.min(83,input.scrollHeight));input.style.height=height+'px';input.classList.toggle('scroll',input.scrollHeight>83);if(api()&&api().pet_resize_input)api().pet_resize_input(height-29)}
function closeComposer(){if(!$('composer').classList.contains('open'))return;$('composer').classList.remove('open');$('text').classList.remove('on');$('pet-input').style.height='29px';if(api()&&api().pet_resize_input)api().pet_resize_input(0)}
function openDashboard(){if(api()&&api().pet_open_dashboard)api().pet_open_dashboard()}
window.tedPet={setState:function(next){clearTimeout(workTimer);state=next||'idle';scheduleBored();if(state==='thinking')workTimer=setTimeout(function(){if(state==='thinking'){state='working';paintState()}},7200)},setHover:function(on){$('stage').classList.toggle('near',!!on)},setMode:function(next){mode=next||'off';$('voice').classList.toggle('on',mode==='voice');$('transcribe').classList.toggle('on',mode==='transcribe')},showMessage:function(role,text){if(role==='user'){engaged=true;$('bubble').classList.remove('show');return}if(!engaged)return;var b=$('bubble');b.querySelector('.text').textContent=String(text||'');b.classList.add('show');clearTimeout(bubbleTimer);bubbleTimer=setTimeout(function(){b.classList.remove('show')},12000)}};
$('voice').onclick=function(){if(api())api().pet_voice_mode().then(tedPet.setMode)};$('transcribe').onclick=function(){if(api())api().pet_transcribe_mode().then(tedPet.setMode)};$('text').onclick=function(){var opening=!$('composer').classList.contains('open');if(!opening){closeComposer();return}$('composer').classList.add('open');$('text').classList.add('on');resizeInput();var focus=function(){setTimeout(function(){$('pet-input').focus();$('pet-input').click()},160)};if(api()&&api().pet_focus)api().pet_focus().then(focus).catch(focus);else focus()};
$('pet-input').oninput=resizeInput;$('composer').onsubmit=function(e){e.preventDefault();var text=$('pet-input').value.trim();if(!text||!api())return;$('pet-input').value='';closeComposer();api().pet_ask(text)};$('pet-input').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}};
/* Native drag stays intact; only a deliberate double click opens the HUD. */
$('character').ondblclick=function(e){if(e.button===0){e.preventDefault();openDashboard()}};$('character').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();openDashboard()}};$('character').oncontextmenu=function(e){e.preventDefault();$('close-x').classList.add('show')};document.onmousedown=function(e){if(e.target!==$('close-x')&&e.button===0)$('close-x').classList.remove('show');if(!$('composer').contains(e.target)&&!$('text').contains(e.target))closeComposer()};$('close-x').onclick=function(e){e.stopPropagation();if(api())api().pet_close();else window.close()};window.addEventListener('pywebviewready',function(){if(api())api().pet_mode().then(tedPet.setMode)});scheduleBored();
</script></body></html>
