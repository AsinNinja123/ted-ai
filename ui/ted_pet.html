<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ted Pet</title>
<style>
:root{--ink:#3a210d;--cyan:#63d9ea;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;
  font-family:"Courier New",monospace;-webkit-user-select:none;user-select:none}
button,textarea{font:700 10px/1.25 "Courier New",monospace}
#stage{position:relative;width:210px;height:100%;min-height:205px;overflow:hidden}

/* The stepped corners make a rounder bubble without introducing smooth UI. */
#bubble{position:absolute;z-index:8;right:4px;top:4px;width:145px;max-height:73px;
  overflow:visible;padding:8px 9px;color:#17120e;background:#fff;border:4px solid var(--ink);
  border-radius:13px;
  filter:drop-shadow(4px 4px 0 rgba(58,33,13,.28));opacity:0;visibility:hidden;
  transform:translate(3px,-3px) scale(.96);transform-origin:bottom left;
  transition:opacity .13s,transform .13s,visibility 0s .13s;-webkit-app-region:no-drag}
#bubble.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
#bubble:before{content:"";position:absolute;left:20px;bottom:-10px;width:8px;height:8px;
  background:#fff;border:3px solid var(--ink);box-shadow:-9px 10px 0 -2px #fff,-9px 10px 0 1px var(--ink)}
#bubble .text{max-height:51px;overflow:auto;white-space:pre-wrap;word-break:break-word;
  font-size:10px;line-height:1.3}

/* 97px is exactly 30% smaller than the previous 138px body. */
#bear{position:absolute;z-index:3;left:50%;top:18px;width:97px;height:auto;
  transform:translateX(-50%);transform-origin:50% 100%;image-rendering:pixelated;
  filter:drop-shadow(3px 4px 0 rgba(40,20,5,.18));cursor:grab;-webkit-user-drag:none}
#bear:active{cursor:grabbing}
#stage.idle #bear{animation:idle 3.1s steps(4,end) infinite}
#stage.thinking #bear{animation:think .95s steps(4,end) infinite}
#stage.speaking #bear{animation:talk .5s steps(2,end) infinite}
#stage.listening #bear{animation:listen 1.25s steps(3,end) infinite;
  filter:drop-shadow(0 0 6px var(--cyan)) drop-shadow(3px 4px 0 rgba(40,20,5,.18))}
#stage.bored #bear{animation:bored 4.8s steps(6,end) infinite}
@keyframes idle{0%,100%{transform:translateX(-50%) scaleY(1)}50%{transform:translateX(-50%) scaleY(1.018)}}
@keyframes think{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-3px) rotate(-1.5deg)}}
@keyframes talk{50%{transform:translateX(-50%) translateY(-2px) scaleY(1.02)}}
@keyframes listen{50%{transform:translateX(-50%) scale(1.025)}}
@keyframes bored{0%,70%,100%{transform:translateX(-50%)}76%{transform:translateX(-50%) rotate(-2deg)}82%{transform:translateX(-50%) rotate(2deg)}}

#emote{position:absolute;z-index:4;left:145px;top:31px;width:36px;height:30px;pointer-events:none}
#emote i{display:none;position:absolute;width:5px;height:5px;background:var(--cyan);border:2px solid var(--ink)}
#stage.thinking #emote i{display:block;animation:dot 1.05s steps(2,end) infinite}
#emote i:nth-child(1){left:0;bottom:2px}.thinking #emote i:nth-child(2){left:10px;bottom:9px;animation-delay:.15s}
.thinking #emote i:nth-child(3){left:21px;bottom:16px;animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-2px)}}
#emote b{display:none;color:#807566;font-size:11px;position:absolute;left:7px;top:7px;text-shadow:2px 0 #fff}
#stage.bored #emote b{display:block;animation:zzz 2.2s steps(4,end) infinite}
@keyframes zzz{0%{opacity:0;transform:translate(0,7px) scale(.7)}35%{opacity:1}100%{opacity:0;transform:translate(10px,-10px)}}

#hover-zone{position:absolute;z-index:2;left:43px;right:43px;top:10px;height:145px}
#controls{position:absolute;z-index:10;left:50%;top:119px;display:flex;gap:8px;opacity:0;
  pointer-events:none;transform:translateX(-50%) translateY(4px);transition:opacity .13s,transform .13s;
  -webkit-app-region:no-drag}
#stage.near #controls,#bear:hover~#controls,#hover-zone:hover~#controls,#controls:hover,
#controls:focus-within,#composer.open~#controls{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.mode{display:grid;place-items:center;width:30px;height:30px;padding:0;border:3px solid var(--ink);
  border-radius:50%;background:#fff3d3;color:var(--ink);cursor:pointer;
  box-shadow:2px 2px 0 rgba(58,33,13,.65);transition:transform .12s,background .12s,box-shadow .12s}
.mode:hover{background:#fff}.mode:active{transform:scale(1.17);box-shadow:none}
.mode.on{background:var(--cyan);transform:scale(1.09);box-shadow:1px 1px 0 rgba(58,33,13,.6)}
.mode svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.3;
  stroke-linecap:square;stroke-linejoin:miter;pointer-events:none}

/* One thin line below the circles. Its top stays fixed; native resize grows the
   window downward as the textarea gains rows. */
#composer{position:absolute;z-index:12;left:12px;right:12px;top:157px;display:none;align-items:flex-start;
  gap:4px;padding:4px;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(58,33,13,.28);
  -webkit-app-region:no-drag}
#composer.open{display:flex}
#pet-input{flex:1;height:24px;min-height:24px;max-height:82px;resize:none;overflow-y:hidden;
  border:0;background:#fff;color:#17120e;padding:5px 4px;outline:none;-webkit-user-select:text;user-select:text}
#pet-input.scroll{overflow-y:auto}
#send{display:grid;place-items:center;width:26px;height:26px;border:0;background:var(--cyan);
  color:var(--ink);cursor:pointer;padding:0}
#send svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.5}

#close-x{position:absolute;z-index:20;display:none;left:52px;top:14px;width:20px;height:20px;
  padding:0;border:3px solid var(--ink);background:#fff;color:var(--ink);font:700 15px/13px
  "Courier New",monospace;cursor:pointer;box-shadow:2px 2px 0 rgba(58,33,13,.4);
  -webkit-app-region:no-drag}
#close-x.show{display:block}#close-x:hover{background:#ffd5ce}
</style>
</head>
<body>
<main id="stage" class="idle">
  <section id="bubble" aria-live="polite"><div class="text"></div></section>
  <div id="emote" aria-hidden="true"><i></i><i></i><i></i><b>Z z</b></div>
  <img id="bear" src="ted_pet.png" alt="Ted, a pixel teddy bear" draggable="false">
  <form id="composer">
    <textarea id="pet-input" rows="1" placeholder="TYPE TO TED..." aria-label="Message Ted"></textarea>
    <button id="send" type="submit" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M3 12h15M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <div id="hover-zone" aria-hidden="true"></div>
  <nav id="controls" aria-label="Ted pet controls">
    <button class="mode" id="voice" type="button" title="Voice mode" aria-label="Voice mode">
      <svg viewBox="0 0 24 24"><path d="M4 7h8M4 12h14M4 17h11"/></svg>
    </button>
    <button class="mode" id="transcribe" type="button" title="Silent transcription" aria-label="Silent transcription">
      <svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3M8 22h8"/></svg>
    </button>
    <button class="mode" id="text" type="button" title="Type to Ted" aria-label="Type to Ted">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M6 9h2M10 9h2M14 9h2M18 9h1M6 13h2M10 13h2M14 13h2M18 13h1M7 16h10"/></svg>
    </button>
  </nav>
  <button id="close-x" type="button" title="Close pet" aria-label="Close pet">&times;</button>
</main>
<script>
function api(){return window.pywebview&&window.pywebview.api?window.pywebview.api:null}
function $(id){return document.getElementById(id)}
var mode='off',state='idle',bored=false,engaged=false,bubbleTimer=null,boredTimer=null,bearDown=null;
function paintState(){
  ['idle','thinking','speaking','listening','error'].forEach(function(s){$('stage').classList.remove(s)});
  $('stage').classList.add(state);$('stage').classList.toggle('bored',bored);
}
function scheduleBored(){
  clearTimeout(boredTimer);bored=false;paintState();if(state!=='idle')return;
  boredTimer=setTimeout(function(){
    if(state!=='idle')return;bored=true;paintState();
    boredTimer=setTimeout(function(){bored=false;paintState();scheduleBored()},7500);
  },26000+Math.random()*14000);
}
function resizeInput(){
  var input=$('pet-input');input.style.height='24px';
  var height=Math.max(24,Math.min(82,input.scrollHeight));input.style.height=height+'px';
  input.classList.toggle('scroll',input.scrollHeight>82);
  if(api()&&api().pet_resize_input)api().pet_resize_input(height-24);
}
function closeComposer(){
  if(!$('composer').classList.contains('open'))return;
  $('composer').classList.remove('open');$('text').classList.remove('on');
  $('pet-input').style.height='24px';if(api()&&api().pet_resize_input)api().pet_resize_input(0);
}
window.tedPet={
  setState:function(next){state=next||'idle';scheduleBored()},
  setHover:function(on){$('stage').classList.toggle('near',!!on)},
  setMode:function(next){
    mode=next||'off';$('voice').classList.toggle('on',mode==='voice');
    $('transcribe').classList.toggle('on',mode==='transcribe');
  },
  showMessage:function(role,text){
    if(role==='user'){engaged=true;$('bubble').classList.remove('show');return}
    if(!engaged)return;
    var b=$('bubble');b.querySelector('.text').textContent=String(text||'');b.classList.add('show');
    clearTimeout(bubbleTimer);bubbleTimer=setTimeout(function(){b.classList.remove('show')},12000);
  }
};
$('voice').onclick=function(){if(api())api().pet_voice_mode().then(tedPet.setMode)};
$('transcribe').onclick=function(){if(api())api().pet_transcribe_mode().then(tedPet.setMode)};
$('text').onclick=function(){
  var opening=!$('composer').classList.contains('open');if(!opening){closeComposer();return}
  $('composer').classList.add('open');$('text').classList.add('on');resizeInput();
  var focus=function(){setTimeout(function(){$('pet-input').focus();$('pet-input').click()},180)};
  if(api()&&api().pet_focus)api().pet_focus().then(focus).catch(focus);else focus();
};
$('pet-input').oninput=resizeInput;
$('composer').onsubmit=function(e){
  e.preventDefault();var text=$('pet-input').value.trim();if(!text||!api())return;
  $('pet-input').value='';closeComposer();api().pet_ask(text);
};
$('pet-input').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}};
$('bear').onmousedown=function(e){if(e.button===0)bearDown={x:e.clientX,y:e.clientY}};
$('bear').oncontextmenu=function(e){e.preventDefault();bearDown=null;$('close-x').classList.add('show')};
document.onmousedown=function(e){
  if(e.target!==$('close-x')&&e.button===0)$('close-x').classList.remove('show');
  if(!$('composer').contains(e.target)&&!$('text').contains(e.target))closeComposer();
};
document.onmouseup=function(e){
  if(!bearDown||e.button!==0)return;
  var moved=Math.hypot(e.clientX-bearDown.x,e.clientY-bearDown.y);bearDown=null;
  if(moved<5&&api())api().pet_open_dashboard();
};
$('close-x').onclick=function(e){e.stopPropagation();if(api())api().pet_close();else window.close()};
window.addEventListener('pywebviewready',function(){if(api())api().pet_mode().then(tedPet.setMode)});
scheduleBored();
</script>
</body>
</html>
