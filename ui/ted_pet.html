<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ted</title>
<style>
/* The window itself is frameless and transparent, so everything visible here
   is drawn by the canvas. Any background colour at all would show up as a
   rectangle floating over Charlie's screen. */
html,body{margin:0;padding:0;background:transparent;overflow:hidden;
  width:100%;height:100%;-webkit-user-select:none;user-select:none;cursor:grab;
  display:flex;align-items:center;justify-content:center}
body:active{cursor:grabbing}
#wrap{position:relative;width:160px;height:160px;flex:none;
  display:flex;align-items:center;justify-content:center}
#pet{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* Controls stay invisible until the pointer is over the pet, so the thing
   sitting on top of everything is a bear and not a bear plus chrome. */
#close{position:absolute;top:2px;right:3px;width:15px;height:15px;border:none;
  border-radius:50%;background:rgba(20,18,16,.78);color:#e8e2d8;font:11px/15px
  -apple-system,sans-serif;text-align:center;padding:0;cursor:pointer;
  opacity:0;transition:opacity .15s;-webkit-app-region:no-drag}
#wrap:hover #close{opacity:1}
#close:hover{background:#c0453c;color:#fff}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="pet"></canvas>
  <button id="close" title="Hide the pet. Ted keeps running.">&times;</button>
</div>

<!-- The bear itself lives in ted_bear.js and is shared with the chat window.
     A sprite copied into both would drift the first time either was touched. -->
<script src="ted_bear.js"></script>
<script>
/* The floating desk pet. Its states are pushed from core/pet.py off Ted's real
   state, so glancing at the bear tells you whether a turn is in flight without
   opening the HUD. */
var bear = TedBear.mount(document.getElementById('pet'),
                         { scale: 7, state: 'idle' });

window.tedPet = {
  /* core/pet.py's contract. `hold` makes a state momentary — a finished tool
     call must not leave the bear celebrating for the rest of the evening. */
  setState: function (next, hold) { bear.setState(next, hold); },
  /* Long idle is a look, not a state, so the five-state contract stays intact
     while the desk pet can still doze after a few quiet minutes. */
  setLongIdle: function (on) { bear.setLongIdle(on); },
  getState: function () { return bear.getState(); }
};

document.getElementById('close').onclick = function (e) {
  e.stopPropagation();
  try { window.pywebview.api.pet_close(); } catch (err) { window.close(); }
};
</script>
</body>
</html>
