<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ted — Memory</title>
<style>
  :root {
    --bg: #151717; --panel: #1a1d1d; --panel2: #212525; --line: #2e3434;
    --text: #e9edec; --dim: #939b99; --accent: #16DEDE;
    --green: #5fc492; --amber: #dcab50; --red: #d95850;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 18px 24px 0; }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header .db { color: var(--dim); font-size: 12px; }
  .maplink { margin-left: auto; color: var(--accent); text-decoration: none;
             font-size: 13px; border: 1px solid var(--line); border-radius: 6px;
             padding: 5px 12px; white-space: nowrap; }
  .maplink:hover { border-color: var(--accent); }
  nav { display: flex; gap: 4px; padding: 14px 24px 0; border-bottom: 1px solid var(--line); }
  nav button { background: none; border: none; color: var(--dim); padding: 8px 14px;
               font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  nav button .count { color: var(--dim); font-size: 11px; margin-left: 5px; }
  main { padding: 18px 24px 60px; max-width: 1500px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  input[type=text], select, textarea {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 7px 10px; font: inherit; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .toolbar input[type=text] { width: 260px; }
  button.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
               border-radius: 7px; padding: 7px 13px; font: inherit; cursor: pointer; }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #0c2b2b; font-weight: 600; }
  button.btn.dangerfill { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  input[type=checkbox].rowcheck { width: 15px; height: 15px; accent-color: var(--accent);
    cursor: pointer; }
  button.btn.danger:hover { border-color: var(--red); color: var(--red); }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line);
           vertical-align: top; word-break: normal; overflow-wrap: break-word; }
  th { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: rgba(91,157,255,.05); }
  td.nowrap { white-space: nowrap; }
  td.date { white-space: nowrap; color: var(--dim); font-size: 13px; }
  td .rowactions { display: flex; gap: 6px; }
  td .rowactions button { font-size: 12px; padding: 4px 9px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .b-ted  { background: #17393a; color: #5fd4d4; }
  .b-user { background: #2f2a3d; color: #c0aae8; }
  .b-created   { background: #1d3a2c; color: var(--green); }
  .b-edited    { background: #3d3218; color: var(--amber); }
  .b-forgotten { background: #3d2020; color: var(--red); }
  .muted { color: var(--dim); font-size: 12px; }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  /* history entries */
  .hentry { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
            padding: 12px 14px; margin-bottom: 10px; }
  .hhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .hhead .tname { font-weight: 600; }
  .hdiff { font-size: 13px; }
  .hdiff .field { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }
  .hdiff .old { color: var(--red); text-decoration: line-through; opacity: .85; }
  .hdiff .new { color: var(--green); }
  .hdiff .arrow { color: var(--dim); margin: 0 6px; }
  .hdiff div { margin: 2px 0; }
  /* modal editor */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
             align-items: center; justify-content: center; z-index: 10; }
  .overlay.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 20px; width: min(560px, 92vw); max-height: calc(100vh - 32px);
           overflow-y: auto; }
  .modal h2 { margin: 0 0 14px; font-size: 15px; }
  .modal label { display: block; margin: 10px 0 4px; color: var(--dim); font-size: 12px;
                 text-transform: uppercase; letter-spacing: .05em; }
  .modal input[type=text], .modal textarea { width: 100%; }
  .modal textarea { min-height: 70px; resize: vertical; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .pager { display: flex; gap: 10px; align-items: center; margin-top: 12px; color: var(--dim); }
  .error { color: var(--red); margin-top: 8px; font-size: 13px; }
  .routine-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
                  gap: 12px; }
  .routine-card { background: var(--panel); border: 1px solid var(--line);
                  border-radius: 10px; padding: 15px; }
  .routine-card.off { opacity: .58; }
  .routine-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .routine-head h3 { margin: 0; font-size: 15px; flex: 1; }
  .phrase-chip { display: inline-block; background: #17393a; color: #83dddd;
                 border-radius: 20px; padding: 3px 9px; margin: 0 4px 5px 0;
                 font-size: 12px; }
  .routine-steps { margin: 7px 0 10px; padding-left: 22px; color: var(--dim); }
  .routine-steps li { margin: 3px 0; }
  .switch { display: inline-flex; gap: 6px; align-items: center; color: var(--dim);
            font-size: 12px; }
  .switch input { accent-color: var(--accent); }
  .testbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
             padding: 13px; margin-bottom: 14px; display: flex; gap: 9px;
             align-items: center; flex-wrap: wrap; }
  .testbox input { flex: 1; min-width: 240px; }
  .step-editor { background: var(--panel2); border: 1px solid var(--line);
                 border-radius: 8px; padding: 11px; margin: 9px 0; }
  .step-top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .step-top select { flex: 1; }
  .step-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .step-fields label { margin: 0; }
  .step-fields input, .step-fields select { width: 100%; }
  .step-fields .checkfield { display: flex; gap: 7px; align-items: center;
                             margin-top: 20px; color: var(--dim); }
  .routine-help { color: var(--dim); margin: -5px 0 12px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Ted — Memory</h1>
  <span class="db" id="dbpath"></span>
  <!-- Opens the generated overview. Separate page, not a tab: it is not a
       table of rows to edit, and squeezing it into the table UI would mean
       teaching that UI a shape it does not have. -->
  <a class="maplink" href="/map" target="_blank" rel="noopener"
     title="A plain-language description of Ted, rebuilt from the code every time you open it">What is Ted?</a>
  <!-- Same reasoning as the map link: a live performance view is not a table
       of editable rows. It is the first thing to open when Ted misbehaves. -->
  <a class="maplink" href="/diagnostics" target="_blank" rel="noopener"
     title="Per-turn timings, token counts, which brain answered, and real errors">Diagnostics</a>
</header>
<nav id="tabs"></nav>
<main id="main"></main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div id="modalFields"></div>
    <div class="error" id="modalError"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="modalSave">Save</button>
    </div>
  </div>
</div>

<script>
const TAB_LABELS = {
  facts: "Facts", session_summaries: "Sessions", exchanges: "Exchanges",
  goals: "Goals", routines: "Routines", history: "History",
};
const PAGE = 50;
let META = {}, currentRows = {}, routineRows = {}, ROUTINE_ACTIONS = {}, routineSteps = [],
    state = { tab: "facts", q: "", offset: 0,
              hFilters: { table: "", actor: "", action: "" } };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function refreshSummary() {
  const s = await api("/api/summary");
  document.getElementById("dbpath").textContent = s.db_path;
  renderTabs(s.counts);
}

function renderTabs(counts) {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  for (const t of Object.keys(TAB_LABELS)) {
    const b = document.createElement("button");
    b.className = state.tab === t ? "active" : "";
    const n = counts[t === "history" ? "history" : t];
    b.innerHTML = TAB_LABELS[t] + (n != null ? `<span class="count">${n}</span>` : "");
    b.onclick = () => { state.tab = t; state.q = ""; state.offset = 0; render(); };
    nav.appendChild(b);
  }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function short(s, n = 220) {
  s = String(s ?? "");
  return s.length > n ? esc(s.slice(0, n)) + "…" : esc(s);
}

const DATE_COLS = new Set(["created", "updated", "ts", "started",
                           "last_mentioned", "completed_at"]);
const COL_LABELS = { created: "when", ts: "when", relationship: "relation",
                     object: "value", text: "memory", exchanges: "turns" };

function fmtDate(s) {
  if (!s) return "";
  const d = new Date(String(s).replace(" ", "T"));
  if (isNaN(d)) return esc(s);
  const now = new Date();
  const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  let day;
  if (d.toDateString() === now.toDateString()) day = "Today";
  else if (d.toDateString() === yest.toDateString()) day = "Yesterday";
  else {
    const opts = { weekday: "short", month: "short", day: "numeric" };
    if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
    day = d.toLocaleDateString([], opts);
  }
  return `<span title="${esc(s)}">${day}, ${time}</span>`;
}

async function render() {
  await refreshSummary();
  if (state.tab === "routines") return renderRoutines();
  if (state.tab === "history") return renderHistory();
  return renderTable(state.tab);
}

// ---------------- phrase -> action routines ----------------
function routineStepLabel(step) {
  const meta = ROUTINE_ACTIONS[step.tool] || { label: step.tool };
  const values = Object.entries(step.args || {}).filter(([,v]) => v !== "" && v !== false)
    .map(([k,v]) => `${k}: ${v}`).join(", ");
  return `${meta.label}${values ? " — " + values : ""}`;
}

async function renderRoutines() {
  const rows = await api("/api/routines");
  routineRows = Object.fromEntries(rows.map(r => [r.id, r]));
  const main = document.getElementById("main");
  let html = `<div class="testbox">
    <input type="text" id="routineTest" placeholder="Try a saying without running it…">
    <button class="btn" onclick="testRoutinePhrase()">Test phrase</button>
    <span class="muted" id="routineTestResult">Checks which routine Ted would run.</span>
  </div>
  <div class="toolbar">
    <button class="btn primary" onclick="openRoutineEditor(null)">+ New routine</button>
    <span class="muted">Hardwired routines skip the model, cost zero tokens, and run immediately.</span>
  </div>`;
  if (!rows.length) {
    html += `<div class="empty">No routines yet. Pair a natural saying with one or more actions.</div>`;
  } else {
    html += `<div class="routine-grid">`;
    for (const r of rows) {
      html += `<div class="routine-card ${r.enabled ? "" : "off"}">
        <div class="routine-head"><h3>${esc(r.name)}</h3>
          <label class="switch"><input type="checkbox" ${r.enabled ? "checked" : ""}
            onchange="toggleRoutine(${r.id}, this.checked)">enabled</label></div>
        <div>${r.phrases.map(p => `<span class="phrase-chip">${esc(p)}</span>`).join("")}</div>
        <ol class="routine-steps">${r.steps.map(s => `<li>${esc(routineStepLabel(s))}</li>`).join("")}</ol>
        <div class="routine-head"><span class="muted">${r.parallel ? "Runs actions together" : "Runs in order"}${r.run_count ? ` · used ${r.run_count} time${r.run_count === 1 ? "" : "s"}` : ""}</span>
          <button class="btn" onclick="openRoutineEditor(${r.id})">Edit</button>
          <button class="btn danger" onclick="deleteRoutine(${r.id})">Delete</button></div>
      </div>`;
    }
    html += `</div>`;
  }
  main.innerHTML = html;
  const test = document.getElementById("routineTest");
  if (test) test.onkeydown = ev => { if (ev.key === "Enter") testRoutinePhrase(); };
}

async function testRoutinePhrase() {
  const q = document.getElementById("routineTest").value;
  const result = document.getElementById("routineTestResult");
  if (!q.trim()) { result.textContent = "Type a phrase first."; return; }
  const data = await api(`/api/routines/match?q=${encodeURIComponent(q)}`);
  result.textContent = data.match ? `Matches “${data.match.name}” — ${data.match.steps.length} action${data.match.steps.length === 1 ? "" : "s"}.` : "No routine matches; Ted would use normal reasoning.";
}

function blankRoutineStep() {
  const tool = Object.keys(ROUTINE_ACTIONS)[0];
  return { tool, args: {} };
}

function openRoutineEditor(id) {
  const row = id == null ? null : routineRows[id];
  editing = { table: "routines", pk: row ? row.id : null };
  routineSteps = row ? JSON.parse(JSON.stringify(row.steps)) : [blankRoutineStep()];
  document.getElementById("modalTitle").textContent = row ? "Edit routine" : "New routine";
  document.getElementById("modalFields").innerHTML = `
    <label>Name *</label><input type="text" id="routineName" value="${esc(row?.name || "")}" placeholder="Comp Org homework">
    <label>Sayings and phrases * <span class="muted">one per line</span></label>
    <textarea id="routinePhrases" placeholder="let's do some comp org homework&#10;time for comp org">${esc((row?.phrases || []).join("\n"))}</textarea>
    <label>Actions *</label><div class="routine-help">Drag-free on purpose: the numbered order below is the run order.</div>
    <div id="routineStepList"></div>
    <button class="btn" type="button" onclick="addRoutineStep()">+ Add action</button>
    <label class="switch" style="margin-top:14px"><input type="checkbox" id="routineEnabled" ${row?.enabled === false ? "" : "checked"}>enabled</label>
    <label class="switch" style="margin-top:8px"><input type="checkbox" id="routineParallel" ${row?.parallel === false ? "" : "checked"}>run independent actions together (faster)</label>`;
  document.getElementById("modalError").textContent = "";
  document.getElementById("overlay").classList.add("open");
  document.getElementById("modalSave").onclick = saveRoutine;
  renderRoutineSteps();
}

function renderRoutineSteps() {
  const host = document.getElementById("routineStepList");
  host.innerHTML = "";
  routineSteps.forEach((step, index) => {
    const meta = ROUTINE_ACTIONS[step.tool];
    const box = document.createElement("div");
    box.className = "step-editor";
    box.innerHTML = `<div class="step-top"><strong>${index + 1}</strong>
      <select onchange="changeRoutineTool(${index}, this.value)">${Object.entries(ROUTINE_ACTIONS).map(([key,m]) => `<option value="${key}" ${key === step.tool ? "selected" : ""}>${esc(m.label)}</option>`).join("")}</select>
      <button class="btn danger" type="button" onclick="removeRoutineStep(${index})">Remove</button></div>
      <div class="step-fields" id="stepFields${index}"></div>`;
    host.appendChild(box);
    const fields = box.querySelector(`#stepFields${index}`);
    for (const [key, spec] of Object.entries(meta.fields)) {
      const value = step.args?.[key] ?? "";
      if (spec.type === "checkbox") {
        fields.innerHTML += `<label class="checkfield"><input type="checkbox" data-step="${index}" data-key="${key}" ${value ? "checked" : ""}>${esc(spec.label)}</label>`;
      } else if (spec.type === "select") {
        fields.innerHTML += `<label>${esc(spec.label)}${spec.required ? " *" : ""}<select data-step="${index}" data-key="${key}">${spec.options.map(v => `<option value="${esc(v)}" ${String(value) === String(v) ? "selected" : ""}>${esc(v || "Default")}</option>`).join("")}</select></label>`;
      } else {
        fields.innerHTML += `<label>${esc(spec.label)}${spec.required ? " *" : ""}<input type="${spec.type}" data-step="${index}" data-key="${key}" value="${esc(value)}" placeholder="${esc(spec.placeholder || "")}"></label>`;
      }
    }
  });
}

function collectRoutineSteps() {
  document.querySelectorAll("[data-step][data-key]").forEach(el => {
    const i = Number(el.dataset.step), key = el.dataset.key;
    routineSteps[i].args[key] = el.type === "checkbox" ? el.checked : el.value;
  });
}
function addRoutineStep() { collectRoutineSteps(); routineSteps.push(blankRoutineStep()); renderRoutineSteps(); }
function removeRoutineStep(i) { collectRoutineSteps(); routineSteps.splice(i, 1); renderRoutineSteps(); }
function changeRoutineTool(i, tool) { collectRoutineSteps(); routineSteps[i] = { tool, args: {} }; renderRoutineSteps(); }

async function saveRoutine() {
  collectRoutineSteps();
  const body = {
    name: document.getElementById("routineName").value,
    phrases: document.getElementById("routinePhrases").value.split("\n").map(s => s.trim()).filter(Boolean),
    steps: routineSteps,
    enabled: document.getElementById("routineEnabled").checked,
    parallel: document.getElementById("routineParallel").checked,
  };
  try {
    await api(editing.pk == null ? "/api/routines" : `/api/routines/${editing.pk}`, {
      method: editing.pk == null ? "POST" : "PUT",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    closeModal(); render();
  } catch (e) { document.getElementById("modalError").textContent = e.message; }
}

async function toggleRoutine(id, enabled) {
  const row = routineRows[id];
  await api(`/api/routines/${id}`, { method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...row, enabled }) });
  render();
}
async function deleteRoutine(id) {
  if (!confirm("Delete this routine? Its phrases will go back to normal reasoning.")) return;
  await api(`/api/routines/${id}`, { method: "DELETE" }); render();
}

// ---------------- data tabs ----------------
async function renderTable(table) {
  const main = document.getElementById("main");
  const meta = META[table];
  const data = await api(`/api/rows/${table}?q=${encodeURIComponent(state.q)}&limit=${PAGE}&offset=${state.offset}`);
  let html = `
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search ${TAB_LABELS[table].toLowerCase()}…" value="${esc(state.q)}">
      <button class="btn primary" onclick="openEditor('${table}', null)">+ Add</button>
      <button class="btn dangerfill" id="delsel" style="display:none"
              onclick="deleteSelected('${table}')">Delete selected</button>
      <span class="muted">${data.total} row${data.total === 1 ? "" : "s"}</span>
    </div>`;
  if (!data.rows.length) {
    html += `<div class="empty">Nothing here${state.q ? " for that search" : " yet"}.</div>`;
  } else {
    html += `<table><thead><tr><th style="width:30px">
      <input type="checkbox" class="rowcheck" id="checkall" onclick="toggleAll(this)"></th>`;
    for (const c of meta.cols) html += `<th>${esc(COL_LABELS[c] || c)}</th>`;
    html += "<th></th></tr></thead><tbody>";
    currentRows = {};
    for (const row of data.rows) {
      currentRows[row._pk] = row;
      html += `<tr onclick="openEditor('${table}', ${row._pk})">
        <td onclick="event.stopPropagation()">
          <input type="checkbox" class="rowcheck rc" value="${row._pk}" onchange="selChanged()">
        </td>`;
      for (const c of meta.cols) {
        let v = row[c], cls = "";
        if (c === "writer") {
          v = `<span class="badge ${v === "user" ? "b-user" : "b-ted"}">${v === "user" ? "You" : "Ted"}</span>`;
          cls = "nowrap";
        } else if (DATE_COLS.has(c)) {
          v = fmtDate(v); cls = "date";
        } else if (c === "who" || c === "status") {
          v = esc(v); cls = "nowrap";
        } else {
          v = short(v);
        }
        html += `<td class="${cls}">${v}</td>`;
      }
      html += `<td onclick="event.stopPropagation()"><div class="rowactions">
        <button class="btn" onclick="openEditor('${table}', ${row._pk})">Edit</button>
        <button class="btn danger" onclick="deleteRow('${table}', ${row._pk})">Delete</button>
      </div></td></tr>`;
    }
    html += "</tbody></table>";
  }
  html += pager(data.total);
  main.innerHTML = html;
  wireSearch();
  wirePager();
}

function pager(total) {
  if (total <= PAGE) return "";
  const page = Math.floor(state.offset / PAGE) + 1, pages = Math.ceil(total / PAGE);
  return `<div class="pager">
    <button class="btn" id="prev" ${state.offset === 0 ? "disabled" : ""}>← Prev</button>
    <span>page ${page} of ${pages}</span>
    <button class="btn" id="next" ${state.offset + PAGE >= total ? "disabled" : ""}>Next →</button>
  </div>`;
}
function wirePager() {
  const p = document.getElementById("prev"), n = document.getElementById("next");
  if (p) p.onclick = () => { state.offset = Math.max(0, state.offset - PAGE); render(); };
  if (n) n.onclick = () => { state.offset += PAGE; render(); };
}
function wireSearch() {
  const el = document.getElementById("search");
  if (!el) return;
  let t;
  el.oninput = () => { clearTimeout(t); t = setTimeout(() => {
    state.q = el.value; state.offset = 0; render().then(() => {
      const s = document.getElementById("search");
      if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    });
  }, 300); };
}

async function deleteRow(table, pk) {
  if (!confirm("Forget this permanently? It will be recorded in History.")) return;
  await api(`/api/rows/${table}/${pk}`, { method: "DELETE" });
  render();
}

function selectedPks() {
  return [...document.querySelectorAll(".rc:checked")].map(c => c.value);
}
function selChanged() {
  const n = selectedPks().length;
  const b = document.getElementById("delsel");
  if (b) { b.style.display = n ? "" : "none"; b.textContent = `Delete selected (${n})`; }
}
function toggleAll(master) {
  document.querySelectorAll(".rc").forEach(c => { c.checked = master.checked; });
  selChanged();
}
async function deleteSelected(table) {
  const pks = selectedPks();
  if (!pks.length) return;
  if (!confirm(`Forget ${pks.length} memor${pks.length === 1 ? "y" : "ies"} permanently? All recorded in History.`)) return;
  for (const pk of pks) {
    try { await api(`/api/rows/${table}/${pk}`, { method: "DELETE" }); } catch (e) {}
  }
  render();
}

// ---------------- editor modal ----------------
let editing = { table: null, pk: null };
function openEditor(table, pk) {
  const meta = META[table];
  const row = pk == null ? null : currentRows[pk];
  editing = { table, pk: row ? row._pk : null };
  document.getElementById("modalTitle").textContent =
    (row ? "Edit " : "New ") + TAB_LABELS[table].replace(/s$/, "").toLowerCase() + " memory";
  const fields = document.getElementById("modalFields");
  fields.innerHTML = "";
  for (const c of meta.editable) {
    const label = document.createElement("label");
    label.textContent = c + (meta.required.includes(c) ? " *" : "");
    fields.appendChild(label);
    const long = ["text", "answer", "question", "object", "description"].includes(c);
    const input = document.createElement(long ? "textarea" : "input");
    if (!long) input.type = "text";
    input.id = "f_" + c;
    input.value = row ? (row[c] ?? "") : "";
    fields.appendChild(input);
  }
  document.getElementById("modalError").textContent = "";
  document.getElementById("overlay").classList.add("open");
  document.getElementById("modalSave").onclick = saveEditor;
}
function closeModal() { document.getElementById("overlay").classList.remove("open"); }
async function saveEditor() {
  const meta = META[editing.table];
  const body = {};
  for (const c of meta.editable) body[c] = document.getElementById("f_" + c).value;
  try {
    if (editing.pk == null)
      await api(`/api/rows/${editing.table}`, { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    else
      await api(`/api/rows/${editing.table}/${editing.pk}`, { method: "PUT",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    closeModal();
    render();
  } catch (e) {
    document.getElementById("modalError").textContent = e.message;
  }
}

// ---------------- history tab ----------------
async function renderHistory() {
  const f = state.hFilters;
  const qs = `table=${f.table}&actor=${f.actor}&action=${f.action}` +
             `&q=${encodeURIComponent(state.q)}&limit=${PAGE}&offset=${state.offset}`;
  const data = await api("/api/history?" + qs);
  const main = document.getElementById("main");
  const opt = (v, label, cur) => `<option value="${v}" ${cur === v ? "selected" : ""}>${label}</option>`;
  let html = `
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search history…" value="${esc(state.q)}">
      <select id="ftable">
        ${opt("", "All memory types", f.table)}
        ${Object.keys(META).map(t => opt(t, TAB_LABELS[t], f.table)).join("")}
      </select>
      <select id="factor">
        ${opt("", "Ted + You", f.actor)}${opt("ted", "Ted", f.actor)}${opt("user", "You", f.actor)}
      </select>
      <select id="faction">
        ${opt("", "All actions", f.action)}${opt("created", "Created", f.action)}
        ${opt("edited", "Edited", f.action)}${opt("forgotten", "Forgotten", f.action)}
      </select>
      <span class="muted">${data.total} event${data.total === 1 ? "" : "s"}</span>
    </div>`;
  if (!data.rows.length) {
    html += `<div class="empty">No history yet. Events appear here as Ted logs
             memories and as you edit them — including what gets forgotten.</div>`;
  }
  for (const e of data.rows) {
    html += `<div class="hentry">
      <div class="hhead">
        <span class="badge b-${e.action}">${e.action}</span>
        <span class="badge ${e.actor === "user" ? "b-user" : "b-ted"}">${e.actor === "user" ? "You" : "Ted"}</span>
        <span class="tname">${TAB_LABELS[e.table_name] || e.table_name}</span>
        <span class="muted">${fmtDate(e.ts)}</span>
      </div>
      <div class="hdiff">${diffHtml(e)}</div>
    </div>`;
  }
  html += pager(data.total);
  main.innerHTML = html;
  wireSearch();
  wirePager();
  for (const [id, key] of [["ftable","table"],["factor","actor"],["faction","action"]]) {
    document.getElementById(id).onchange = ev => {
      state.hFilters[key] = ev.target.value; state.offset = 0; render();
    };
  }
}

function diffHtml(e) {
  const o = e.old_value || {}, n = e.new_value || {};
  const keys = [...new Set([...Object.keys(o), ...Object.keys(n)])];
  let out = "";
  for (const k of keys) {
    const ov = o[k], nv = n[k];
    if (e.action === "created") {
      out += `<div><span class="field">${esc(k)}</span><span class="new">${short(nv)}</span></div>`;
    } else if (e.action === "forgotten") {
      out += `<div><span class="field">${esc(k)}</span><span class="old">${short(ov)}</span></div>`;
    } else if (String(ov) !== String(nv)) {
      out += `<div><span class="field">${esc(k)}</span><span class="old">${short(ov)}</span>` +
             `<span class="arrow">→</span><span class="new">${short(nv)}</span></div>`;
    }
  }
  return out || `<span class="muted">no visible field changes</span>`;
}

// ---------------- boot ----------------
(async () => {
  [META, ROUTINE_ACTIONS] = await Promise.all([
    api("/api/meta"), api("/api/routines/actions")
  ]);
  render();
  setInterval(() => { if (state.tab === "history" && !document.getElementById("overlay").classList.contains("open")) render(); }, 15000);
})();
</script>
