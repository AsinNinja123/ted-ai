<html lang="en">
<head>

<title>Ted School</title>
<style>
:root{--ink:#202631;--muted:#697386;--faint:#98a2b3;--paper:#fff;--canvas:#f5f6f8;--line:#e3e6eb;--line2:#cfd4dc;--side:#20242b;--side2:#303640;--blue:#3157d5;--blue2:#eef2ff;--red:#ce4141;--amber:#c8890c;--green:#27845a;--warn:#f2ca4f}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,input,select,textarea{font:inherit}button{color:inherit}
#app{height:100%;display:grid;grid-template-columns:248px minmax(0,1fr);transition:grid-template-columns .2s}#app.side-collapsed{grid-template-columns:72px minmax(0,1fr)}
aside{position:relative;background:var(--side);color:#d7dbe2;display:flex;flex-direction:column;min-width:0;overflow:hidden}#sidebar-toggle{position:absolute;right:-13px;top:25px;z-index:3;width:28px;height:28px;border:1px solid #444c58;border-radius:50%;background:#2a3039;color:#fff;cursor:pointer;box-shadow:0 3px 12px #0005}.brand{height:108px;padding:24px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #343a44}.brand-mark{width:37px;height:37px;border:1px solid #59616d;border-radius:8px;display:grid;place-items:center;font:600 17px Georgia;background:#292f37;flex:none}.brand-copy{white-space:nowrap;overflow:hidden}.brand-copy strong{display:block;font:600 18px Georgia;color:#fff}.brand-copy span{display:block;margin-top:4px;font-size:9px;color:#929aa7;letter-spacing:.13em;text-transform:uppercase}
.nav-scroll{padding:15px 10px;overflow-y:auto;flex:1}.nav-label{padding:15px 11px 7px;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:#747d8b;font-weight:700;white-space:nowrap}.nav{width:100%;border:0;background:transparent;border-radius:7px;padding:10px 11px;display:flex;align-items:center;gap:11px;color:#bcc3ce;cursor:pointer;text-align:left;font-size:13px;white-space:nowrap;margin:1px 0}.nav:hover{background:#2b313a;color:#fff}.nav.active{background:#353c47;color:#fff;box-shadow:inset 3px 0 #fff}.nav .ico{width:19px;text-align:center;flex:none}.nav .count{margin-left:auto;font-size:10px;color:#8f98a7}.nav-text{overflow:hidden;text-overflow:ellipsis}.class-dot{width:10px;height:10px;border-radius:2px;background:var(--dot);flex:none}.caution{margin-left:auto;color:var(--warn)}.side-bottom{padding:9px 10px;border-top:1px solid #343a44}.manual-note{margin:0 10px 12px;padding:9px;border:1px solid #5b4e25;background:#2b281e;border-radius:7px;color:#cbbd7a;font-size:10px;line-height:1.45}.manual-note b{color:#f5da71}
#app.side-collapsed .brand{padding:24px 17px}#app.side-collapsed .brand-copy,#app.side-collapsed .nav-text,#app.side-collapsed .nav-label,#app.side-collapsed .manual-note,#app.side-collapsed .nav .count,#app.side-collapsed .caution{display:none}#app.side-collapsed .nav{justify-content:center;padding:11px 8px}#app.side-collapsed #sidebar-toggle{transform:rotate(180deg)}
main{overflow-y:auto;min-width:0;background:#fff}.main-inner{max-width:1320px;margin:auto;padding:36px 42px 70px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:24px}.heading .kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);font-weight:700}.heading h1{font:500 34px Georgia;margin:7px 0 6px}.heading p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:9px 13px;font-size:12px;font-weight:600;cursor:pointer}.btn:hover{background:#f7f8fa}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#2448bd}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:11px}.btn.quiet{border:0;color:var(--muted)}
.top-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:27px;overflow-x:auto}.top-tab{border:0;background:transparent;padding:11px 15px 12px;color:#697386;font-size:12px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}.top-tab.active{color:var(--blue);border-bottom-color:var(--blue)}.tab-count{margin-left:5px;background:#f0f2f5;border-radius:99px;padding:1px 6px;font-size:9px}.top-tab.active .tab-count{background:var(--blue2);color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}.stat{border:1px solid var(--line);border-radius:8px;padding:15px 17px}.stat .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.stat strong{display:block;font:600 27px Georgia;margin-top:8px}.stat.today strong{color:var(--blue)}.stat.overdue strong{color:var(--red)}.stat.priority strong{color:var(--amber)}.mode-banner{display:flex;gap:9px;border:1px solid #ead991;background:#fffbea;border-radius:7px;padding:9px 12px;margin:-8px 0 24px;color:#766629;font-size:11px}
.section{margin:28px 0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:12px}.section-head h2{font-size:14px;margin:0}.section-head span,.section-head button{font-size:11px;color:var(--muted)}
.class-rows{display:flex;flex-direction:column;gap:10px}.class-row{position:relative;display:grid;grid-template-columns:minmax(220px,1.4fr) minmax(220px,1fr) 90px 150px;align-items:center;gap:20px;min-height:92px;padding:16px 18px 16px 24px;border:1px solid var(--line2);cursor:pointer}.class-row:before,.task:before{content:'';position:absolute;left:0;top:0;bottom:0;background:var(--class)}.class-row:before{width:7px}.class-row:hover{border-color:#aeb5c0;box-shadow:0 3px 12px #1f293711}.class-code{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}.class-name h3{font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.class-meta{font-size:11px;color:var(--muted);line-height:1.55}.class-open{text-align:center}.class-open strong{display:block;font-size:22px;color:var(--class)}.class-open span{font-size:9px;text-transform:uppercase;color:var(--faint)}.row-actions{display:flex;gap:6px;justify-content:flex-end}
.toolbar{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}.search{position:relative;flex:1;min-width:210px}.search input{width:100%;border:1px solid var(--line2);border-radius:6px;padding:10px 12px 10px 34px;outline:none}.search:before{content:'⌕';position:absolute;left:11px;top:4px;color:#7f8896;font-size:21px}.filter{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:9px 10px;font-size:12px}
.task-list{display:flex;flex-direction:column;gap:8px}.task{position:relative;display:grid;grid-template-columns:30px minmax(220px,1fr) minmax(125px,.35fr) minmax(130px,.4fr) 46px;align-items:center;min-height:70px;padding:10px 12px 10px 18px;gap:11px;border:1px solid var(--line)}.task:before{width:5px}.check{width:19px;height:19px;border:2px solid #9aa3b0;border-radius:4px;background:#fff;cursor:pointer}.task.closed{opacity:.56}.task.closed .check{border-color:var(--green);background:var(--green);color:#fff}.task.closed .check:after{content:'✓'}.task.closed .task-title{text-decoration:line-through}.task-main{min-width:0}.task-title{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-sub{display:flex;gap:6px;align-items:center;margin-top:5px;color:var(--muted);font-size:10px;flex-wrap:wrap}.pill{border:1px solid #e0e3e8;background:#f8f9fb;border-radius:99px;padding:2px 7px;text-transform:capitalize}.pill.high{border-color:#f1d7aa;color:#9b640c;background:#fff8ea}.task-class,.due{font-size:11px;color:#596273}.task-class{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.due.overdue{color:var(--red);font-weight:600}.due.today{color:var(--blue);font-weight:600}.task-edit{background:transparent;border:0;color:#798292;padding:7px;cursor:pointer}.empty{border:1px dashed var(--line2);padding:38px 20px;text-align:center;background:#fafbfc}.empty h3{font-size:15px;margin:9px 0 5px}.empty p{font-size:11px;color:var(--muted);margin:0 0 14px}
.future-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.future{border:1px solid #e7d48a;background:#fffcef;border-radius:8px;padding:17px}.future .flag{color:var(--amber);font-size:18px}.future h3{font-size:14px;margin:10px 0 6px}.future p{color:#776b45;font-size:11px;line-height:1.5}.future .later{display:inline-block;border:1px solid #ddc86e;color:#8d7520;border-radius:99px;padding:3px 7px;font-size:9px;text-transform:uppercase}
#modal{position:fixed;inset:0;background:#161c2688;backdrop-filter:blur(3px);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.dialog{width:min(680px,100%);max-height:92vh;overflow-y:auto;background:#fff;border-radius:10px;box-shadow:0 18px 55px #1e243030}.dialog-head{padding:18px 21px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialog-head h2{margin:0;font-size:17px}.close{border:0;background:transparent;color:#7f8896;font-size:23px;cursor:pointer}.form{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:1/-1}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#667085;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line2);border-radius:6px;background:#fff;padding:10px;outline:none;font-size:12px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}.field textarea{min-height:78px;resize:vertical}.field-hint{font-size:10px;color:var(--faint)}.picker-wrap{display:grid;grid-template-columns:1fr 38px;gap:6px}.picker-button{border:1px solid var(--line2);background:#f8f9fb;border-radius:6px;cursor:pointer}.type-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.type-choice{position:relative}.type-choice input{position:absolute;opacity:0}.type-choice span{display:block;border:1px solid var(--line2);border-radius:6px;padding:9px 7px;text-align:center;font-size:11px;text-transform:capitalize;cursor:pointer}.type-choice input:checked+span{border-color:var(--blue);background:var(--blue2);color:var(--blue);font-weight:700}.form-footer{display:flex;justify-content:space-between;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}.right{display:flex;gap:8px;margin-left:auto}.form-error{font-size:11px;color:var(--red);margin-top:10px;min-height:15px}
@media(max-width:950px){.main-inner{padding:30px 25px}.class-row{grid-template-columns:1fr 1fr 70px}.row-actions{display:none}.task{grid-template-columns:30px 1fr 115px 44px}.task-class{display:none}}@media(max-width:700px){#app,#app.side-collapsed{grid-template-columns:72px 1fr}.brand{padding:24px 17px}.brand-copy,.nav-text,.nav-label,.manual-note,.nav .count,.caution{display:none}.nav{justify-content:center}.main-inner{padding:25px 16px}.topbar{display:block}.actions{justify-content:flex-start;margin-top:16px}.stats{grid-template-columns:repeat(2,1fr)}.class-row{grid-template-columns:1fr 60px}.class-meta{display:none}.task{grid-template-columns:30px 1fr 40px}.due{display:none}.form-grid{grid-template-columns:1fr}.field.wide,.type-grid{grid-column:auto}.type-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app">
 <aside>
  <button id="sidebar-toggle" title="Collapse sidebar" aria-label="Collapse sidebar">‹</button>
  <div class="brand"><div class="brand-mark">T</div><div class="brand-copy"><strong>School</strong><span>by Ted</span></div></div>
  <div class="nav-scroll"><div class="nav-label">Workspace</div>
   <button class="nav active" data-view="overview" title="Overview"><span class="ico">⌂</span><span class="nav-text">Overview</span></button>
   <button class="nav" data-view="all" title="All schoolwork"><span class="ico">☷</span><span class="nav-text">All schoolwork</span><span class="count" id="n-open">0</span></button>
   <div class="nav-label">Classes</div><div id="class-nav"></div>
   <button class="nav" id="nav-add-class"><span class="ico">＋</span><span class="nav-text">Add a class</span></button>
   <div class="nav-label">Later</div><button class="nav" data-view="future"><span class="ico">⚠</span><span class="nav-text">Future connections</span><span class="caution">3</span></button>
  </div>
  <div class="side-bottom"><button class="nav" data-view="completed"><span class="ico">✓</span><span class="nav-text">Finished work</span></button></div>
  <div class="manual-note"><b>⚠ Manual mode</b><br>Ted can read this planner, but only you can change it.</div>
 </aside>
 <main><div class="main-inner" id="content"></div></main>
</div>
<div id="modal" role="dialog" aria-modal="true"><div class="dialog"><div class="dialog-head"><h2 id="modal-title"></h2><button class="close" id="modal-close">×</button></div><form class="form" id="modal-form"></form></div></div>
<script>
const API='/api/school',state={data:null,view:'overview',classId:null,query:'',status:'open'},$=id=>document.getElementById(id),esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML};
async function api(url,opts){const r=await fetch(url,opts);let b={};try{b=await r.json()}catch(e){}if(!r.ok)throw Error(b.error||'Something went wrong');return b}function options(a,c,l){return a.map(v=>`<option value="${esc(v)}"${v===c?' selected':''}>${esc(l&&l[v]||v.replace('_',' '))}</option>`).join('')}function cls(id){return state.data.classes.find(c=>c.id===Number(id))}function task(id){return state.data.tasks.find(t=>t.id===Number(id))}function closed(t){return['done','submitted'].includes(t.status)}function due(t){return t.due_at?new Date(t.due_at):null}function today(){const d=new Date();d.setHours(0,0,0,0);return d}function bucket(t){if(closed(t))return'completed';const d=due(t);if(!d)return'open';const n=new Date(),s=today(),tm=new Date(s),w=new Date(s);tm.setDate(s.getDate()+1);w.setDate(s.getDate()+8);if(d<n)return'overdue';if(d<tm)return'today';if(d<w)return'upcoming';return'open'}function fmtDue(t){if(!t.due_at)return'No due date';const d=due(t),tm=new Date(today());tm.setDate(tm.getDate()+1);const time=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});return d>=today()&&d<tm?`Today · ${time}`:`${d.toLocaleDateString([],{month:'short',day:'numeric'})} · ${time}`}
function title(){if(state.classId)return cls(state.classId)?.name||'Class';return{overview:'School overview',today:'Due today',upcoming:'Next 7 days',overdue:'Overdue work',all:'All schoolwork',completed:'Finished work',future:'Future connections'}[state.view]}function visible(){let r=state.data.tasks.slice();if(state.classId)r=r.filter(t=>t.class_id===state.classId);if(!['overview','all','future','class'].includes(state.view))r=r.filter(t=>bucket(t)===state.view);if((state.view==='all'||state.classId)&&state.status==='open')r=r.filter(t=>!closed(t));if(state.status==='done')r=r.filter(closed);if(state.query){const q=state.query.toLowerCase();r=r.filter(t=>(t.title+' '+t.notes+' '+(t.class_name||'')).toLowerCase().includes(q))}return r}
function setSidebar(x){$('app').classList.toggle('side-collapsed',x);try{localStorage.setItem('ted_school_sidebar',x?'collapsed':'open')}catch(e){}}$('sidebar-toggle').onclick=()=>setSidebar(!$('app').classList.contains('side-collapsed'));try{setSidebar(localStorage.getItem('ted_school_sidebar')==='collapsed')}catch(e){}
async function load(){state.data=await api(API);render()}function selectView(v,id=null){state.view=v;state.classId=id;state.query='';render()}function renderNav(){$('n-open').textContent=state.data.counts.open;$('class-nav').innerHTML=state.data.classes.map(c=>`<button class="nav class-link" data-id="${c.id}" title="${esc(c.name)}"><span class="class-dot" style="--dot:${esc(c.color)}"></span><span class="nav-text">${esc(c.name)}</span><span class="count">${c.open_tasks}</span></button>`).join('');document.querySelectorAll('.nav[data-view]').forEach(b=>{b.classList.toggle('active',!state.classId&&b.dataset.view===state.view);b.onclick=()=>selectView(b.dataset.view)});document.querySelectorAll('.class-link').forEach(b=>{b.classList.toggle('active',state.classId===+b.dataset.id);b.onclick=()=>selectView('class',+b.dataset.id)});$('nav-add-class').onclick=()=>openClass()}
function tabs(){const a=[['overview','Overview',''],['today','Today',state.data.counts.today],['upcoming','Next 7 days',''],['overdue','Overdue',state.data.counts.overdue],['all','All work',state.data.counts.open]];return`<nav class="top-tabs">${a.map(([v,l,n])=>`<button class="top-tab ${!state.classId&&state.view===v?'active':''}" onclick="selectView('${v}')">${l}${n!==''?`<span class="tab-count">${n}</span>`:''}</button>`).join('')}</nav>`}function header(sub){return`<div class="topbar"><div class="heading"><div class="kicker">School planner</div><h1>${esc(title())}</h1><p>${esc(sub)}</p></div><div class="actions"><button class="btn" onclick="openClass()">＋ New class</button><button class="btn primary" onclick="openTask()">＋ Add schoolwork</button></div></div>${tabs()}`}function stats(){const c=state.data.counts;return`<div class="stats"><div class="stat"><div class="label">Open work</div><strong>${c.open}</strong></div><div class="stat today"><div class="label">Due today</div><strong>${c.today}</strong></div><div class="stat overdue"><div class="label">Overdue</div><strong>${c.overdue}</strong></div><div class="stat priority"><div class="label">High priority</div><strong>${c.high}</strong></div></div>`}
function empty(t,p,b,a){return`<div class="empty"><div>◇</div><h3>${esc(t)}</h3><p>${esc(p)}</p>${b?`<button class="btn primary" onclick="${a}">${esc(b)}</button>`:''}</div>`}function classes(){if(!state.data.classes.length)return empty('No classes yet','Add each class once, then keep its work together.','Add your first class','openClass()');return`<div class="class-rows">${state.data.classes.map(c=>`<article class="class-row" style="--class:${esc(c.color)}" onclick="selectView('class',${c.id})"><div class="class-name"><div class="class-code">${esc(c.code||c.term||'Class')}</div><h3>${esc(c.name)}</h3></div><div class="class-meta">${esc([c.instructor,c.meeting_times,c.location].filter(Boolean).join(' · ')||'Add instructor, schedule, or location')}</div><div class="class-open"><strong>${c.open_tasks}</strong><span>open</span></div><div class="row-actions"><button class="btn small" onclick="event.stopPropagation();openClass(${c.id})">Edit</button><button class="btn small" onclick="event.stopPropagation();openTask(null,${c.id})">Add work</button></div></article>`).join('')}</div>`}
function tasks(r){if(!r.length)return empty('Nothing here','Add schoolwork or try another view.','Add schoolwork','openTask()');return`<div class="task-list">${r.map(t=>`<article class="task ${closed(t)?'closed':''}" style="--class:${esc(t.class_color||'#98a2b3')}"><button class="check" onclick="toggleDone(${t.id})"></button><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-sub"><span class="pill">${esc(t.kind)}</span><span class="pill ${t.priority}">${esc(t.priority)}</span>${t.estimated_minutes?`<span>~${t.estimated_minutes} min</span>`:''}</div></div><div class="task-class">${esc(t.class_name||'General / Other')}</div><div class="due ${bucket(t)}">${esc(fmtDue(t))}</div><button class="task-edit" onclick="openTask(${t.id})">•••</button></article>`).join('')}</div>`}function toolbar(){return`<div class="toolbar"><div class="search"><input id="search" value="${esc(state.query)}" placeholder="Search schoolwork…"></div><select class="filter" id="status"><option value="open">Open only</option><option value="all"${state.status==='all'?' selected':''}>Any status</option><option value="done"${state.status==='done'?' selected':''}>Finished only</option></select></div>`}function wire(){const q=$('search');if(q)q.oninput=()=>{state.query=q.value;$('task-host').innerHTML=tasks(visible())};const s=$('status');if(s)s.onchange=()=>{state.status=s.value;render()}}
function overview(){const next=state.data.tasks.filter(t=>!closed(t)&&['today','upcoming'].includes(bucket(t))).slice(0,10);$('content').innerHTML=header('Your classes and the work coming up next.')+stats()+`<div class="mode-banner">⚠ <div><b>Manual mode:</b> you control every class and deadline. Ted can read these exact records.</div></div><section class="section"><div class="section-head"><h2>Classes</h2><span>${state.data.classes.length} total</span></div>${classes()}</section><section class="section"><div class="section-head"><h2>Next 7 days</h2><button class="btn quiet" onclick="selectView('upcoming')">See full view →</button></div>${tasks(next)}</section>`}function list(){const c=state.classId&&cls(state.classId),sub=c?[c.code,c.instructor,c.meeting_times,c.location].filter(Boolean).join(' · ')||'Everything for this class':'Filter, finish, and edit your schoolwork.';$('content').innerHTML=header(sub)+(c?`<div class="actions" style="justify-content:flex-start;margin:-12px 0 22px"><button class="btn small" onclick="openClass(${c.id})">Edit class</button><button class="btn small danger" onclick="removeClass(${c.id})">Delete class</button></div>`:'')+toolbar()+`<div id="task-host">${tasks(visible())}</div>`;wire()}function future(){$('content').innerHTML=header('These yellow markers are reminders for later integrations.')+`<div class="future-grid">${[['Email assignment intake','School email can later feed possible deadlines into a review inbox.'],['Syllabus and LMS import','Syllabi and a school portal can eventually feed this planner.'],['Calendar and reminders','Deadlines can later create calendar events and proactive reminders.']].map(x=>`<div class="future"><div class="flag">⚠</div><h3>${x[0]}</h3><p>${x[1]}</p><span class="later">Not connected</span></div>`).join('')}</div>`}function render(){renderNav();state.view==='overview'?overview():state.view==='future'?future():list()}
function showModal(t,b){$('modal-title').textContent=t;$('modal-form').innerHTML=b;$('modal').style.display='flex'}function closeModal(){$('modal').style.display='none'}$('modal-close').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};function val(f,n){return f.elements[n]?.value||''}function openPicker(n){const e=$('modal-form').elements[n];e?.showPicker?e.showPicker():e?.focus()}
function openClass(id){const c=id?cls(id):null;showModal(c?'Edit class':'Add a class',`<div class="form-grid"><div class="field wide"><label>Class name *</label><input name="name" required value="${esc(c?.name||'')}" placeholder="Class name"></div><div class="field"><label>Course code</label><input name="code" value="${esc(c?.code||'')}" placeholder="COURSE 101"></div><div class="field"><label>Term</label><input name="term" value="${esc(c?.term||'Fall 2026')}"></div><div class="field"><label>Instructor</label><input name="instructor" value="${esc(c?.instructor||'')}"></div><div class="field"><label>Location</label><input name="location" value="${esc(c?.location||'')}"></div><div class="field wide"><label>Meeting schedule</label><input name="meeting_times" value="${esc(c?.meeting_times||'')}"></div><div class="field"><label>Class color</label><input name="color" type="color" value="${esc(c?.color||'#3157d5')}"></div></div><div id="form-error" class="form-error"></div><div class="form-footer">${c?`<button type="button" class="btn danger" onclick="removeClass(${c.id})">Delete class</button>`:'<span></span>'}<div class="right"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></div>`);$('modal-form').onsubmit=async e=>{e.preventDefault();const f=e.target,p={name:val(f,'name'),code:val(f,'code'),term:val(f,'term'),instructor:val(f,'instructor'),location:val(f,'location'),meeting_times:val(f,'meeting_times'),color:val(f,'color')};try{await api(API+'/classes'+(c?'/'+c.id:''),{method:c?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});closeModal();load()}catch(x){$('form-error').textContent=x.message}}}
function kinds(current){return state.data.task_kinds.map(k=>`<label class="type-choice"><input type="radio" name="kind" value="${k}"${k===current?' checked':''}><span>${k}</span></label>`).join('')}function openTask(id,preset){const t=id?task(id):null,selected=t?t.class_id:(preset||state.classId||''),dt=t?.due_at?t.due_at.split('T'):['',''],co=`<option value="">General / Other</option>`+state.data.classes.map(c=>`<option value="${c.id}"${+selected===c.id?' selected':''}>${esc(c.name)}</option>`).join('');showModal(t?'Edit schoolwork':'Add schoolwork',`<div class="form-grid"><div class="field wide"><label>Title *</label><input name="title" required value="${esc(t?.title||'')}" placeholder="What needs to be done?"></div><div class="field wide"><label>Classify it</label><div class="type-grid">${kinds(t?.kind||'assignment')}</div></div><div class="field"><label>Class</label><select name="class_id">${co}</select></div><div class="field"><label>Priority</label><select name="priority">${options(state.data.priorities,t?.priority||'normal')}</select></div><div class="field"><label>Due date</label><div class="picker-wrap"><input name="due_date" type="date" value="${dt[0]||''}"><button type="button" class="picker-button" onclick="openPicker('due_date')">▣</button></div><span class="field-hint">Click the calendar and choose a day.</span></div><div class="field"><label>Due time</label><div class="picker-wrap"><input name="due_time" type="time" value="${dt[1]||''}"><button type="button" class="picker-button" onclick="openPicker('due_time')">◷</button></div><span class="field-hint">Blank means 11:59 PM.</span></div><div class="field"><label>Estimated minutes</label><input name="estimated_minutes" type="number" min="1" value="${t?.estimated_minutes||''}"></div><div class="field"><label>Status</label><select name="status">${options(state.data.task_statuses,t?.status||'todo',{todo:'To do',in_progress:'In progress',submitted:'Submitted',done:'Done'})}</select></div><div class="field wide"><label>Notes</label><textarea name="notes">${esc(t?.notes||'')}</textarea></div><div class="field"><label>Source label</label><input name="source_label" value="${esc(t?.source_label||'')}"></div><div class="field"><label>Source link</label><input name="source_url" value="${esc(t?.source_url||'')}"></div></div><div id="form-error" class="form-error"></div><div class="form-footer">${t?`<button type="button" class="btn danger" onclick="removeTask(${t.id})">Delete</button>`:'<span></span>'}<div class="right"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></div>`);$('modal-form').onsubmit=async e=>{e.preventDefault();const f=e.target,d=val(f,'due_date'),tm=val(f,'due_time'),p={title:val(f,'title'),class_id:val(f,'class_id'),kind:val(f,'kind'),due_at:d?d+'T'+(tm||'23:59'):'',estimated_minutes:val(f,'estimated_minutes'),priority:val(f,'priority'),status:val(f,'status'),notes:val(f,'notes'),source_label:val(f,'source_label'),source_url:val(f,'source_url')};try{await api(API+'/tasks'+(t?'/'+t.id:''),{method:t?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});closeModal();load()}catch(x){$('form-error').textContent=x.message}}}
async function toggleDone(id){const t=task(id);await api(API+'/tasks/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:closed(t)?'todo':'done'})});load()}async function removeTask(id){const t=task(id);if(confirm(`Delete “${t.title}”?`)){await api(API+'/tasks/'+id,{method:'DELETE'});closeModal();load()}}async function removeClass(id){const c=cls(id);if(confirm(`Delete ${c.name}? Its schoolwork will move to General / Other.`)){await api(API+'/classes/'+id,{method:'DELETE'});state.classId=null;state.view='overview';closeModal();load()}}
load().catch(e=>{$('content').innerHTML=empty('School dashboard unavailable',e.message,'','')});
</script>
</body>
</html>
